   ========================================================= */
function viewStateKey() {
  return 'coc-notes:viewState:' + ((S.doc && S.doc.id) || 'none');
}
function captureViewState() {
  if (!S.doc) return null;
  const cols = document.getElementById('cols');
  const tops = {};
  if (cols) {
    for (const c of Array.from(cols.children)) {
      if (c.classList && c.classList.contains('col')) tops[c.dataset.depth] = Math.round(c.scrollTop);
    }
  }
  return {
    sel: S.sel || null,
    viewMode: S.viewMode,
    colsLeft: cols ? Math.round(cols.scrollLeft) : 0,
    tops: tops,
    view: S.viewMode === 'tree' ? { x: Math.round(S.view.x), y: Math.round(S.view.y), k: Number(S.view.k) || 1 } : null,
    ts: Date.now(),
  };
}
let __viewSaveTimer = 0;
function saveViewStateNow() {
  if (__viewSaveTimer) { clearTimeout(__viewSaveTimer); __viewSaveTimer = 0; }
  try {
    const st = captureViewState();
    if (st) localStorage.setItem(viewStateKey(), JSON.stringify(st));
  } catch (e) { /* 隐私模式等写不进去就算了，不影响使用 */ }
}
function scheduleSaveViewState() {
  if (__viewSaveTimer) return;
  __viewSaveTimer = setTimeout(saveViewStateNow, 350);
}
function loadViewState() {
  try {
    const raw = localStorage.getItem(viewStateKey());
    if (!raw) return null;
    const st = JSON.parse(raw);
    return st && typeof st === 'object' ? st : null;
  } catch (e) { return null; }
}
function bindViewStateSaving() {
  const cols = document.getElementById('cols');
  if (cols) cols.addEventListener('scroll', scheduleSaveViewState, { passive: true });
  window.addEventListener('pagehide', () => { saveViewStateNow(); saveChatNow(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { saveViewStateNow(); saveChatNow(); } });
}

async function boot() {
  document.documentElement.dataset.font = settings.font;
  applyTrunkStyle();
  const race = (p, ms, fb) => Promise.race([p.catch(() => fb), new Promise(r => setTimeout(() => r(fb), ms))]);
  let docs = await race(Store.all('docs'), 1000, []);
  let doc = null;
  const last = await race(Store.get('meta', 'lastDoc'), 800, null);
  if (last) doc = docs.find(d => d.id === last.value) || null;
  if (!doc && docs.length) doc = docs.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
  if (!doc) {
    doc = newDoc('猩红信笺（示例）');
    seedSample(doc);
  }
  doc.nodes = doc.nodes || {};
  doc.rootIds = doc.rootIds || [];
  doc.settings = doc.settings || { types: [] };
  doc.settings.types = doc.settings.types || [];
  S.doc = doc;
  S.sel = doc.rootIds[0] || null;
  S.chat = loadChat();   /* 接着上次的 AI 对话 */
  migrateSummaryLocks();   /* 老数据：已有且不过期的大纲视为已锁定，升级后不再白算一遍 */
  /* 回到上次看的那张卡片：选中项、视图模式、各列滚动位置一起还原 */
  const savedView = loadViewState();
  if (savedView) {
    if (savedView.sel && doc.nodes[savedView.sel]) S.sel = savedView.sel;
    if (savedView.viewMode === 'trunk' || savedView.viewMode === 'tree' || savedView.viewMode === 'place') S.viewMode = savedView.viewMode;
    S.restoreView = savedView;
  }
  Undo.reset();
  refreshNbName();
  document.body.classList.toggle('mode-trunk', S.viewMode === 'trunk');
  document.body.classList.toggle('mode-place', S.viewMode === 'place');
  $$('#modeSwitch button').forEach(b => b.classList.toggle('on', b.dataset.mode === S.viewMode));
  { const pv = document.getElementById('placeView'); if (pv) pv.hidden = S.viewMode !== 'place'; }
  bindColsPan();
  bindDrag();
  bindViewStateSaving();
  applyAutosaveTimer();   /* 定时自动保存（默认每 5 分钟，设置里可改） */
  renderCostBar();
  /* 点旁边空白处 = 完成编辑（文本框外任意位置，除按钮/开关） */
  document.addEventListener('mousedown', (ev) => {
    if (!S.edit) return;
    if (ev.target.closest && ev.target.closest('.ta,input,button,.toggle,.type-btn,.addbtn,.pop,.menu,.modal')) return;
    S.edit = null;
    editStamp++;
    renderTree();
  }, true);
  { const c = document.getElementById('cols'); if (c) c.addEventListener('scroll', scheduleEnvelope, { passive: true }); }
  window.addEventListener('resize', scheduleEnvelope);
  const restoredTree = !!(savedView && S.viewMode === 'tree' && savedView.view);
  if (restoredTree) Object.assign(S.view, savedView.view);
  renderTree();
  if (S.viewMode !== 'trunk') S.restoreView = null;   /* 只有主干视图消费这份恢复状态，避免以后切模式时误用 */
  applyView();
  if (!restoredTree) setTimeout(() => { if (S.viewMode === 'tree') fitView(); }, 60);
  if (location.hash === '#place') setViewMode('place');
  makeSnapshot(false);
  $('#onlyRead').checked = localStorage.getItem('coc-notes:onlyRead') !== '0';
  try { await refreshAiModelLabel(true); } catch (e) { /* 拿不到模型名不影响使用 */ }
  if (savedView) devLog({ type: 'view-restored', sel: (S.sel && nodeOf(S.sel) || {}).title || null, mode: S.viewMode });
  devSelfTest();
  watchReloadCommand();
}

/* =========================================================
   24. 开发自检（宿主 ~/.dsh/branch-notes/dev.json 里的开关）
   ========================================================= */
function devLog(payload) {
  try {
    fetch(AI_BASE + '/log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ src: 'app', href: location.href }, payload)),
      keepalive: true,
    }).catch(() => {});
  } catch (e) { /* 日志失败不影响使用 */ }
}

async function devSelfTest() {
  let flags = null;
  try {
    const r = await fetch(AI_BASE + '/dev-flags', { cache: 'no-store' });
    flags = await r.json();
  } catch (e) { return; }
  devLog({ type: 'app-boot', origin: location.origin, hasAi: !!(aiInfo && aiInfo.llm) });
  devLog({
    type: 'selftest-env',
    secure: !!window.isSecureContext,
    idb: !!window.indexedDB,
    clipboard: !!(navigator.clipboard && navigator.clipboard.writeText),
    directoryPicker: typeof window.showDirectoryPicker === 'function',
    cookies: !!navigator.cookieEnabled,
    ua: String(navigator.userAgent || '').slice(0, 60),
  });
  if (!flags || !flags.appSelfTest) return;
  devLog({ type: 'selftest-start' });
  try {
    // 1) 结构自检：示例数据是否就绪
    const roots = (S.doc && S.doc.rootIds || []).length;
    const nodes = Object.keys((S.doc && S.doc.nodes) || {}).length;
    devLog({ type: 'selftest-doc', roots, nodes, name: S.doc && S.doc.name });
    // 2) AI 流式自检
    let got = '';
    await aiChat([
      { role: 'system', content: '你是克苏鲁的呼唤剧本顾问，回答不超过 20 字。' },
      { role: 'user', content: '一句话：废弃灯塔里那本还在跳动的航海日志，最合理的解释是什么？' },
    ], (delta, full) => { got = full; });
    devLog({ type: 'selftest-chat', chars: got.length, text: got.slice(0, 120) });
    // 3) 总结自检：对第一条有正文的节点跑一次
    const target = Object.values((S.doc && S.doc.nodes) || {}).find(n => (n.content || '').trim().length > 20);
    if (target) {
      devLog({ type: 'selftest-summary-start', node: target.title, contentLen: (target.content || '').length });
      const summary = await summarizeOne(target);
      devLog({ type: 'selftest-summary', node: target.title, chars: summary.length, summary });
    } else {
      devLog({ type: 'selftest-summary-skip', reason: '没有内容足够长的节点' });
    }
    devLog({ type: 'selftest-done' });
  } catch (e) {
    devLog({ type: 'selftest-error', message: String((e && e.stack) || e) });
  }
}

/* 面板热更新：宿主命令队列里出现新的 reload 请求时，iframe 自己重载一次。
   为什么不在客户端改写 iframe.src：主面板是 React 渲染的，命令式改 src 会被随后的 re-render 覆盖。 */
function watchReloadCommand() {
  const SEEN = 'coc-notes:reloadSeen';
  const bootAt = Date.now(); /* 本次加载时刻：早于它的命令不响应，避免自己触发自己形成连环重载 */
  async function tick() {
    try {
      const r = await fetch(AI_BASE + '/commands', { cache: 'no-store' });
      const d = await r.json();
      const ts = Number((d && d.openRequest) || 0);
      if (!(d && d.reload) || !ts) return;
      if (ts < bootAt - 500) return;
      const seen = Number(localStorage.getItem(SEEN) || 0);
      if (ts <= seen) return;
      localStorage.setItem(SEEN, String(ts));
      location.reload();
    } catch (e) { /* 命令通道不可用时忽略 */ }
  }
  setTimeout(tick, 1200);
  setInterval(tick, 3000);
}

boot().catch(e => {
  console.error(e);
  document.body.innerHTML = '<pre style="padding:30px;color:#a33;white-space:pre-wrap">启动失败：\n' + (e && e.stack || e) + '</pre>';
});

</script>
<script>
/* ─────────────────────────────────────────────────────────────────────────
   智能体收件箱（运行期追加，不改动上面任何既有逻辑）
   宿主路由：
     POST /api/dsh-branch-notes/inbox       { name, markdown }
     GET  /api/dsh-branch-notes/inbox       取出待导入
     POST /api/dsh-branch-notes/inbox/ack   { ids: [...] }
   面板每 4 秒拉一次；有内容就按「笔记协议 v1」导成新剧本并切过去。
   ───────────────────────────────────────────────────────────────────────── */
(function () {
  'use strict';
  if (window.__branchNotesInbox) return;
  window.__branchNotesInbox = { pulled: 0, last: null };
  var BASE = '/api/dsh-branch-notes';

  async function importOne(item) {
    var parsed = parseBranchMarkdown(String(item.markdown || ''));
    if (!parsed.roots || !parsed.roots.length) throw new Error('没有可导入的枝条');
    var wanted = (parsed.name || '').trim() || String(item.name || '').replace(/\.md$/i, '') || '智能体笔记';
    var used = new Set((await Store.all('docs')).map(function (d) { return d.name; }));
    var docName = wanted, n = 2;
    while (used.has(docName)) docName = wanted + '（' + (n++) + '）';
    var doc = newDoc(docName);
    var count = 0;
    async function walk(list, parentId) {
      for (var i = 0; i < list.length; i++) {
        var node = list[i];
        var content = await storeDataImages(node.content || '');
        var nd = makeNode(parentId);
        nd.title = node.title || '未命名';
        nd.type = node.type || 'none';
        nd.summary = node.summary || '';
        nd.content = content;
        nd.hash = hashOf(content);
        doc.nodes[nd.id] = nd;
        if (parentId) doc.nodes[parentId].children.push(nd.id);
        else doc.rootIds.push(nd.id);
        count++;
        await walk(node.children || [], nd.id);
      }
    }
    await walk(parsed.roots, null);
    await saveNow();                                  // 先把当前剧本存好
    await Store.put('docs', JSON.parse(JSON.stringify(doc)));
    S.doc = doc; S.sel = doc.rootIds[0] || null; S.focusId = null; S.edit = null;
    S.ctxOff.clear(); S.placeAct = 'all';
    Undo.reset(); renderTree(); resetView(); refreshNbName(); await saveNow();
    return { name: docName, count: count, roots: doc.rootIds.length };
  }

  function ack(ids) {
    return fetch(BASE + '/inbox/ack', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: ids }),
    }).catch(function () { /* 下一轮再确认 */ });
  }

  async function pull() {
    if (!S.doc) return;                               // 等 boot() 装好剧本
    var data;
    try {
      var res = await fetch(BASE + '/inbox', { cache: 'no-store' });
      if (!res.ok) return;
      data = await res.json();
    } catch (e) { return; }
    var items = (data && data.items) || [];
    if (!items.length) return;
    var done = [];
    for (var i = 0; i < items.length; i++) {
      try {
        var info = await importOne(items[i]);
        done.push(items[i].id);
        window.__branchNotesInbox.last = info;
        window.__branchNotesInbox.pulled++;
        toast('已导入「' + info.name + '」：' + info.count + ' 条笔记');
      } catch (e) { console.warn('[inbox] 导入失败', items[i].id, e); }
    }
    if (done.length) await ack(done);
  }

  setTimeout(pull, 1500);
  setInterval(pull, 4000);
})();
</script>
<script>
/* ─────────────────────────────────────────────────────────────────────────
   深链定位：?goto=<枝条标题>
   客户端在「对话里让模型打开面板」时会把标题带进来，这里等数据装好后定位并高亮。
   ───────────────────────────────────────────────────────────────────────── */
(function () {
  'use strict';
  var target = '';
  try {
    target = new URLSearchParams(location.search).get('goto') || '';
  } catch (e) {
    target = '';
  }
  if (!target) return;
  var tries = 0;
  (function jump() {
    try {
      if (typeof jumpToTitle === 'function' && S && S.doc && S.doc.nodes) {
        jumpToTitle(target);
        return;
      }
    } catch (e) { /* 继续等 */ }
    if (tries++ < 60) setTimeout(jump, 150);
  })();
})();
</script>
