/* =========================================================
   10. 画布：平移 / 缩放 / 居中 / 迷你地图
   ========================================================= */
function applyView() {
  if (S.viewMode === 'trunk') return;
  const st = $('#stage');
  st.style.transform = `translate(${S.view.x}px,${S.view.y}px) scale(${S.view.k})`;
  $('#zoomPill').textContent = Math.round(S.view.k * 100) + '%';
  updateMinimap();
  scheduleSaveViewState();   /* 缩放/平移也记下来，下次进来还是这个视口 */
}

function zoomAt(cx, cy, factor) {
  const vr = $('#viewport').getBoundingClientRect();
  const px = cx - vr.left, py = cy - vr.top;
  const k2 = clamp(S.view.k * factor, 0.25, 2);
  const ratio = k2 / S.view.k;
  S.view.x = px - (px - S.view.x) * ratio;
  S.view.y = py - (py - S.view.y) * ratio;
  S.view.k = k2;
  applyView();
}

function centerOn(id, keepScale) {
  if (S.viewMode === 'trunk') {
    revealInColumn(id);
    return;
  }
  const el = $(`.node[data-id="${id}"] > .card`);
  if (!el) return;
  const vr = $('#viewport').getBoundingClientRect();
  const st = $('#stage').getBoundingClientRect();
  const k0 = S.view.k || 1;
  const r = el.getBoundingClientRect();
  const cx = (r.left - st.left) / k0, cy = (r.top - st.top) / k0;
  const cw = r.width / k0, ch = r.height / k0;

  /* 专注写作 / 地点模式：直接把卡片居中 */
  if (S.focusId || S.viewMode === 'place') {
    S.view.x += (vr.left + vr.width / 2) - (r.left + r.width / 2);
    S.view.y += (vr.top + vr.height * 0.38) - (r.top + r.height / 2);
    applyView();
    return;
  }

  /* 横向枝条：让「主干（根列）在左」与「当前卡片可见」同时成立，放不下就降缩放 */
  const rootEl = $('#trunk > .node > .card');
  let trunkLeft = cx;
  if (rootEl) {
    const rr = rootEl.getBoundingClientRect();
    trunkLeft = (rr.left - st.left) / k0 - 34;
  }
  const left = Math.min(cx, trunkLeft);
  const right = cx + cw;
  const padL = 34, padR = 44;
  const avail = Math.max(300, vr.width - padL - padR);
  /* 尽量放大到 100%，但必须同时容下「主干左缘 → 当前卡片右缘」 */
  const needStage = Math.max(1, right - left);
  const k = clamp(Math.min(1.15, avail / needStage), 0.5, 1.25);
  const spanW = needStage * k;
  const extra = avail - spanW;
  S.view.k = k;
  S.view.x = padL - left * k + (extra > 0 ? Math.min(extra * 0.45, 150) : 0);
  S.view.y = vr.height * 0.42 - (cy + ch / 2) * k;
  /* 无论如何先保证当前卡片完整落在视口里 */
  const cardRight = S.view.x + right * k;
  if (cardRight > vr.width - padR) S.view.x = vr.width - padR - right * k;
  const cardLeft = S.view.x + cx * k;
  if (cardLeft < 10) S.view.x = 10 - cx * k;
  applyView();
}

function fitView() {
  if (S.viewMode === 'trunk') return;
  const cards = $$('#trunk .card');
  if (!cards.length) { resetView(); return; }
  const vr = $('#viewport').getBoundingClientRect();
  const sr = $('#stage').getBoundingClientRect();
  const k0 = S.view.k;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const c of cards) {
    const r = c.getBoundingClientRect();
    const x = (r.left - sr.left) / k0, y = (r.top - sr.top) / k0;
    minX = Math.min(minX, x); minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + r.width / k0); maxY = Math.max(maxY, y + r.height / k0);
  }
  const w = maxX - minX, h = maxY - minY;
  const k = clamp(Math.min((vr.width - 120) / w, (vr.height - 120) / h), 0.25, 1.25);
  S.view.k = k;
  S.view.x = (vr.width - w * k) / 2 - minX * k;
  S.view.y = (vr.height - h * k) / 2 - minY * k;
  applyView();
}

function resetView() { S.view = { x: 0, y: 0, k: 1 }; applyView(); }

let mmMap = null;
function updateMinimap() {
  const cv = $('#mmCanvas');
  if (!cv) return;
  if (S.viewMode === 'place' || S.viewMode === 'trunk') return;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const cards = $$('#trunk .card');
  if (!cards.length) return;
  const k = S.view.k;
  const vr = $('#viewport').getBoundingClientRect();
  const sr = $('#stage').getBoundingClientRect();
  const rects = cards.map(c => {
    const r = c.getBoundingClientRect();
    return { id: c.dataset.id, x: (r.left - sr.left) / k, y: (r.top - sr.top) / k, w: r.width / k, h: r.height / k };
  });
  const minX = Math.min(...rects.map(r => r.x)) - 20;
  const maxX = Math.max(...rects.map(r => r.x + r.w)) + 20;
  const minY = Math.min(...rects.map(r => r.y)) - 20;
  const maxY = Math.max(...rects.map(r => r.y + r.h)) + 20;
  const sc = Math.min((W - 6) / (maxX - minX), (H - 6) / (maxY - minY));
  const ox = 3 + ((W - 6) - (maxX - minX) * sc) / 2;
  const oy = 3 + ((H - 6) - (maxY - minY) * sc) / 2;
  const px = x => ox + (x - minX) * sc;
  const py = y => oy + (y - minY) * sc;
  mmMap = { sc, minX, minY, ox, oy };
  for (const r of rects) {
    const n = nodeOf(r.id);
    const t = n ? typeOf(n.type) : { fg: '#ccc' };
    ctx.fillStyle = r.id === S.sel ? '#8C7A6B' : (t.fg + '99');
    ctx.fillRect(px(r.x), py(r.y), Math.max(2, r.w * sc), Math.max(1.5, r.h * sc));
  }
  // 视口框
  const vx = (-S.view.x) / k, vy = (-S.view.y) / k;
  ctx.strokeStyle = 'rgba(140,122,107,.55)';
  ctx.lineWidth = 1;
  ctx.strokeRect(px(vx), py(vy), (vr.width / k) * sc, (vr.height / k) * sc);
}

function openPop(anchor, items) {
  const pop = $('#pop');
  pop.innerHTML = '';

    if (it.label) { const d = document.createElement('div'); d.className = 'label'; d.textContent = it.label; pop.appendChild(d); continue; }
    const d = document.createElement('div');
    d.className = 'item';
    if (it.color) {

      d.appendChild(sw);
    }
    const s = document.createElement('span'); s.textContent = it.text; d.appendChild(s);
    if (it.on) {
      const k = document.createElement('span'); k.className = 'grow'; d.appendChild(k);
      const hint = document.createElement('span'); hint.style.cssText = 'color:#A39A91;font-size:11px';
      hint.textContent = '✓'; d.appendChild(hint);

    d.onclick = () => { closePop(); it.run && it.run(); };
    pop.appendChild(d);
  }
  pop.hidden = false;
  const r = anchor.getBoundingClientRect();
  const pr = pop.getBoundingClientRect();
  let x = r.right - pr.width, y = r.bottom + 6;
  if (x < 8) x = 8;
  if (y + pr.height > innerHeight - 8) y = r.top - pr.height - 6;
  pop.style.left = x + 'px'; pop.style.top = y + 'px';

function openMenu(anchor, items) {

/* =========================================================
   13. 图片：粘贴 / 拖入 / 压缩 / 存储
   ========================================================= */
async function saveImage(file) {
  const id = uid();
  let blob = file;
  try {
    const bmp = await createImageBitmap(file);
    const maxW = 2000;
    const scale = Math.min(1, maxW / bmp.width);
    if (scale < 1 || file.size > 700 * 1024) {
      const cv = document.createElement('canvas');
      cv.width = Math.round(bmp.width * scale);
      cv.height = Math.round(bmp.height * scale);
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      const out = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.86));
      if (out) blob = out;
      bmp.close && bmp.close();
    }
  } catch (e) { /* 原样保存 */ }
  await Store.put('assets', {
    id, name: file.name || (id + '.jpg'), mime: blob.type || 'image/jpeg',
    width: 0, height: 0, blob: blob, at: Date.now(),
  });
  return 'dshimg:' + id;
}

function insertAtCursor(ta, text) {
  const s = ta.selectionStart, e = ta.selectionEnd;
  const v = ta.value;
  ta.value = v.slice(0, s) + text + v.slice(e);
  ta.selectionStart = ta.selectionEnd = s + text.length;
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}

async function onPaste(ev, ta) {
  const items = [...(ev.clipboardData?.items || [])];
  const files = items.filter(i => i.type && i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
  if (!files.length) return;
  ev.preventDefault();
  for (const f of files) {
    toast('正在处理图片…', 900);
    const marker = await saveImage(f);
    insertAtCursor(ta, `\n![](${marker})\n`);
  }
  toast('图片已插入');
}

async function dropImages(files, nodeId) {
  const n = nodeOf(nodeId);
  if (!n) { toast('先选中一个节点'); return; }
  let s = '';
  for (const f of files) {
    if (!f.type.startsWith('image/')) continue;
    const marker = await saveImage(f);
    s += `\n![](${marker})\n`;
  }
  if (!s) return;
  n.content = (n.content || '') + s;
  n.ts = Date.now(); touch(); Undo.push(true); renderTree(); scheduleSave();
  toast('图片已插入到「' + nodeLabel(n) + '」');
}

function openSearch() {
  const box = openModal(`
    <div class="row" style="margin:0">
      <input type="text" id="q" placeholder="搜标题和正文…（↑↓ 选择，Enter 跳转）" autocomplete="off">
    </div>
    <div id="qres" style="margin-top:8px;max-height:50vh;overflow:auto"></div>`);
  const q = $('#q'), res = $('#qres');
  let list = [], cursor = 0;
  const paint = () => {
    res.innerHTML = '';
    if (!list.length) { res.innerHTML = '<p style="color:#A39A91;font-size:12.5px">没有匹配的节点</p>'; return; }
    list.forEach((n, i) => {
      const d = document.createElement('div');
      d.className = 'item';
      d.style.cssText = 'padding:7px 9px;border-radius:7px;cursor:pointer;display:flex;gap:8px;align-items:baseline' +
        (i === cursor ? ';background:#F3EFE9' : '');
      const t = typeOf(n.type);
      d.innerHTML = `<span style="width:8px;height:8px;border-radius:3px;background:${t.bg};border:1px solid rgba(0,0,0,.06);flex:0 0 auto"></span>
        <span style="font-weight:600;font-size:13px">${esc(nodeLabel(n))}</span>
        <span style="color:#A39A91;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(norm(n.content).slice(0, 60))}</span>`;
      d.onclick = () => { go(n.id); };
      res.appendChild(d);
    });
  };
  const go = id => {
    closeModal();
    if (S.viewMode === 'place') setViewMode('tree');
    for (const a of ancestorsOf(id)) a.collapsed = false;
    if (S.focusId) S.focusId = null;
    selectNode(id, true);
    flash(id);
  };
  const search = () => {
    const k = norm(q.value).toLowerCase();
    list = !k ? [] : Object.values(S.doc.nodes).filter(n =>
      norm(n.title).toLowerCase().includes(k) || norm(n.content).toLowerCase().includes(k)
    ).slice(0, 40);
    cursor = 0; paint();
  };
  q.addEventListener('input', search);
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); cursor = clamp(cursor + 1, 0, list.length - 1); paint(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); cursor = clamp(cursor - 1, 0, list.length - 1); paint(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (list[cursor]) go(list[cursor].id); }
    else if (e.key === 'Escape') { closeModal(); }
  });
  setTimeout(() => q.focus(), 20);
}

let aiInfo = null;          /* /models 的最近一次结果 */
function escModelText(v) {
  return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
/** 当前用哪个模型：优先用户手选，其次 Harness 默认，最后第一个可用模型。 */
function currentAiModel() {
  const models = (aiInfo && aiInfo.models) || [];
  const saved = settings.aiModel;
  if (saved && models.some(m => m.provider === saved.provider && m.id === saved.model)) return saved;
  const sel = aiInfo && aiInfo.selection;
  if (sel && sel.provider && sel.model && models.some(m => m.provider === sel.provider && m.id === sel.model)) {
    return { provider: sel.provider, model: sel.model };
  }
  if (models[0]) return { provider: models[0].provider, model: models[0].id };
  if (sel && sel.provider && sel.model) return { provider: sel.provider, model: sel.model };
  return null;
}
function modelLabel(m) {
  return (m.name || m.id) + (m.provider === 'deepseek-account' ? ' · 账号' : '');
}
async function refreshAiModelLabel(force) {
  if (!aiInfo || force) {
    try {
      const r = await fetch(AI_BASE + '/models', { cache: 'no-store' });
      if (r.ok) aiInfo = await r.json();
    } catch (e) { /* 宿主半不可用时保持上一次的值 */ }
  }
  const sel = $('#aiModelSel');
  if (sel) {
    const models = (aiInfo && aiInfo.models) || [];
    const cur = currentAiModel();
    const opts = models.map(m => {
      const on = cur && cur.provider === m.provider && cur.model === m.id;
      return '<option value="' + escModelText(m.provider + '::' + m.id) + '"' + (on ? ' selected' : '') + '>' + escModelText(modelLabel(m)) + '</option>';
    });
    for (const u of (aiInfo && aiInfo.unavailable) || []) {
      opts.push('<option value="" disabled>' + escModelText(u.name + '（' + u.reason + '）') + '</option>');
    }
    sel.innerHTML = opts.join('') || '<option value="">内置模型</option>';
    const effort = aiInfo && aiInfo.selection && aiInfo.selection.reasoningEffort;
    sel.title = (cur ? cur.provider + ' / ' + cur.model : '内置模型')
      + (effort ? ' · 思考强度 ' + effort : '')
      + '｜模型与凭据由 DeepSeek Harness 提供，不需要也不会保存 API Key';
    if (!sel.dataset.bound) {
      sel.dataset.bound = '1';
      sel.onchange = () => {
        const raw = String(sel.value || '');
        if (!raw) return;
        const cut = raw.indexOf('::');

/* =========================================================
   17. AI：上下文 / 流式对话
   ========================================================= */
const SYS_PROMPT = `你是《克苏鲁的呼唤》（COC 7版）跑团剧本的资深守秘人（KP）顾问。
你的使用者正在写一个剧本。你的职责：
1. 读懂他给的剧本结构和文字，顺着他的风格提建议，不要擅自改写世界观。
2. 熟悉调查循环：线索 → 推理 → 遭遇 → 理智损失 → 升级；关心"玩家在这段里做什么决定"。
3. 提建议时给可直接抄进剧本的具体内容（台词、检定、场景描写），不要空泛的方法论。
4. 中文回答。信息不足就先问一个最关键的问题，不要编造他没写的设定。`;

function ctxTargetId() { return S.focusId || S.sel; }

/* 上下文取材方式：outline（默认：每个节点的一句话大纲 + 当前节点全文）| full（整篇正文） */
function ctxMode() { return localStorage.getItem('coc-notes:ctxMode') === 'full' ? 'full' : 'outline'; }
function setCtxMode(mode) {
  try { localStorage.setItem('coc-notes:ctxMode', mode === 'full' ? 'full' : 'outline'); } catch (e) {}
  updateCtxBar();
  toast(mode === 'full' ? '上下文：整篇正文（更贵、更详细）' : '上下文：一句话大纲（省 token）');
}

function buildContextText(mode) {
  const tid = ctxTargetId();
  const parts = [];
  const offRoots = S.ctxOff;

  const isOff = id => {
    let n = nodeOf(id);
    while (n) { if (offRoots.has(n.id)) return true; n = n.parentId ? nodeOf(n.parentId) : null; }
    return false;
  };

  const out = [];
  const walk = (id, depth) => {
    const n = nodeOf(id);
    if (!n || isOff(id)) return;
    out.push({ n, depth });
    for (const c of n.children) walk(c, depth + 1);
  };
  for (const r of S.doc.rootIds) walk(r, 0);

  if (mode === 'local' && tid) {
    const t = nodeOf(tid);
    const anc = ancestorsOf(tid);
    const rel = new Set([tid, ...subtreeIds(tid)]);
    const near = new Set(anc.map(a => a.id));
    for (const s of siblingsOf(tid)) { near.add(s.id); subtreeIds(s.id).forEach(x => near.add(x)); }
    parts.push('【当前正在写的节点】\n标题：' + (t.title || '（无）') + '\n正文：\n' + (t.content || '（空）'));
    if (anc.length) parts.push('【它所在的脉络（祖先）】\n' + anc.map(a => '- ' + (a.title || '未命名') + (a.summary ? '｜' + a.summary : '')).join('\n'));
    const outline = out.filter(o => o.n.summary).map(o => '  '.repeat(o.depth) + '- ' + (o.n.title || '未命名') + '：' + o.n.summary);
    if (outline.length) parts.push('【整篇剧本的一句话大纲】\n' + outline.join('\n'));
    return parts.join('\n\n');
  }

  if (mode === 'outline') {
    /* 大纲模式：每个节点只给「一句话大纲」，当前正在看的这一条给全文（问题基本都是冲着它问的） */
    if (tid) {
      const t = nodeOf(tid);
      parts.push('【当前正在看的节点（全文）】\n标题：' + (t.title || '（无）') + '\n类型：' + typeOf(t.type).name
        + '\n正文：\n' + (t.content || '（空）'));
      const anc = ancestorsOf(tid);
      if (anc.length) parts.push('【它的上级脉络】\n' + anc.map(a => '- ' + (a.title || '未命名') + (a.summary ? '｜' + a.summary : '')).join('\n'));
    }
    const rows = out.map(o => {
      const n = o.n;
      const label = '  '.repeat(o.depth) + '- ' + (n.title || '未命名') + (n.type !== 'none' ? '（' + typeOf(n.type).name + '）' : '');
      return label + '：' + (n.summary ? n.summary : '（这一条还没有一句话大纲）');
    });
    if (rows.length) parts.push('【整篇剧本的一句话大纲（每条一行）】\n' + rows.join('\n'));
    parts.push('说明：以上大纲是你了解整篇剧本的依据；只有在当前节点那一节里你才有完整正文。若回答必须依赖某个节点的细节，先说明你需要哪一条，再让使用者把那条正文发给你或切到「上下文：整篇正文」。');
    return parts.join('\n\n');
  }

  // 整体模式：能详细读全部
  const detail = out.filter(o => !(mode === 'local'));
  const lines = out.map(o =>
    `${'#'.repeat(Math.min(6, o.depth + 1))} ${o.n.title || '未命名'}` +
    (o.n.type !== 'none' ? `（${typeOf(o.n.type).name}）` : '') + '\n' + (o.n.content || ''));
  parts.push('【整篇剧本的完整内容】\n' + lines.join('\n\n'));
  return parts.join('\n\n');
}

function ctxStats() {
  const tid = ctxTargetId();
  const mode = S.focusId ? 'local' : (ctxMode() === 'full' ? 'global' : 'outline');
  const text = buildContextText(mode);
  return { text, tokens: estTokens(text), mode };
}

function updateCtxBar() {
  if (!$('#ctxText')) return;  const tid = ctxTargetId();
  const n = tid && nodeOf(tid);
  if (!n) { $('#ctxText').textContent = '尚未选择节点'; $('#ctxDetail').innerHTML = ''; return; }
  const { mode } = ctxStats();
  const ancN = ancestorsOf(tid).length;
  const sumN = Object.values(S.doc.nodes).filter(x => x.summary && !S.ctxOff.has(x.id)).length;
  const tk = ctxStats().tokens;
  const modeBtn = $('#ctxModeBtn');
  if (modeBtn) modeBtn.textContent = S.focusId ? '专注' : (ctxMode() === 'full' ? '全文' : '大纲');
  $('#ctxText').innerHTML = (mode === 'local'
    ? `当前节点 + 祖先 ${ancN} 层 + 大纲 ${sumN} 条`
    : (mode === 'outline'
        ? `大纲 ${sumN} 条 + 当前节点全文（${Object.keys(S.doc.nodes).length} 条里）`
        : `全篇详细内容（${Object.keys(S.doc.nodes).length} 条）`)) +
    ` ≈ <b>${tk >= 1000 ? (tk / 1000).toFixed(1) + 'k' : tk}</b> tokens`;
  const box = $('#ctxDetail');
  box.innerHTML = '';
  for (const r of rootsOf()) {
    const d = document.createElement('label');
    d.className = 'ctx-item';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !S.ctxOff.has(r.id);
    const sub = subtreeIds(r.id).length;
    cb.onchange = () => {
      if (cb.checked) S.ctxOff.delete(r.id); else S.ctxOff.add(r.id);
      updateCtxBar();
    };
    const t = document.createElement('span');
    t.className = 't';
    t.textContent = nodeLabel(r) + (sub > 1 ? `（含 ${sub - 1} 条枝干）` : '');
    d.appendChild(cb); d.appendChild(t);
    box.appendChild(d);
  }
}

const scheduleCtx = debounce(() => updateCtxBar(), 600);

/* ---------- 用量与费用：按剧本记账，按 DeepSeek 官方峰谷价折算 ----------
 * 价格来源：DeepSeek 官方价目页（2026-09-10 起的价目，人民币 / 1M tokens）
 *   Flash（deepseek-flash / deepseek-v4.1-flash / deepseek-v4-flash）
 *     谷价：命中 ¥0.02、未命中 ¥1、输出 ¥4
 *   Pro（deepseek-v4-pro）
 *     谷价：命中 ¥0.15、未命中 ¥4.5、输出 ¥13.5
 *   峰价 = 谷价 × 2（官方「高峰时段」规则）
 * 峰时段：UTC 01:00–04:00、06:00–10:00 = 北京时间 09:00–12:00、14:00–18:00；
 *   其余为空闲时段；北京时间周六/周日（2026-08-22 16:00Z 起）与中国法定假日全天谷价。
 * 命中/未命中用 usage.cacheReadTokens 区分；缓存写入按命中价计（官方未单列写入价）。
 */
const PRICE_TABLE = {
  'deepseek-flash':          { label: 'DeepSeek-V4.1-Flash', hit: 0.02, miss: 1,   out: 4 },
  'deepseek-v4.1-flash':     { label: 'DeepSeek-V4.1-Flash', hit: 0.02, miss: 1,   out: 4 },
  'deepseek-v4-flash':       { label: 'DeepSeek-V4-Flash',   hit: 0.02, miss: 1,   out: 4 },
  'deepseek-v4.1-flash-vision-exp': { label: 'DeepSeek-V4.1-Flash', hit: 0.02, miss: 1, out: 4 },
  'deepseek-v4-pro':         { label: 'DeepSeek-V4-Pro',     hit: 0.15, miss: 4.5, out: 13.5 },
};
const PEAK_MULTIPLIER = 2;
const PEAK_EFFECTIVE_AT = Date.parse('2026-08-01T00:00:00Z');
const WEEKEND_OFFPEAK_FROM = Date.parse('2026-08-22T16:00:00Z');
const COST_HOLIDAYS = [
  '2026-09-25', '2026-09-26', '2026-09-27',
  '2026-10-01', '2026-10-02', '2026-10-03', '2026-10-04',
  '2026-10-05', '2026-10-06', '2026-10-07',
];
const COST_MAX_CALLS = 200;   /* 明细最多留 200 条，合计始终累计 */

/* 北京时间日序号（UTC+8 的日界） */
function beijingDayIndex(ms) { return Math.floor((ms + 8 * 3600000) / 86400000); }

/* 该时刻是否处于「空闲时段」（谷价） */
function isOffPeakAt(ms) {
  if (!Number.isFinite(ms) || ms < PEAK_EFFECTIVE_AT) return false;
  if (ms >= WEEKEND_OFFPEAK_FROM) {
    const day = beijingDayIndex(ms);
    const weekday = (day + 4) % 7;             /* 0=周日 … 6=周六 */
    if (weekday === 0 || weekday === 6) return true;
    const ymd = new Date(day * 86400000).toISOString().slice(0, 10);
    if (COST_HOLIDAYS.includes(ymd)) return true;
  }
  const d = new Date(ms);
  const hour = d.getUTCHours() + d.getUTCMinutes() / 60;
  const inPeak = (hour >= 1 && hour < 4) || (hour >= 6 && hour < 10);   /* UTC 峰时段 */
  return !inPeak;
}

function priceForModel(model, ms) {
  const raw = String(model || '').trim().toLowerCase();
  const key = PRICE_TABLE[raw] ? raw : (raw.includes('pro') ? 'deepseek-v4-pro' : 'deepseek-flash');
  const base = PRICE_TABLE[key];
  const offPeak = isOffPeakAt(ms);
  const m = offPeak ? 1 : PEAK_MULTIPLIER;
  return { label: base.label, hit: base.hit * m, miss: base.miss * m, out: base.out * m, offPeak, model: key };
}

function costKey() { return 'coc-notes:cost:' + ((S.doc && S.doc.id) || 'none'); }

function emptyCostBook() {
  return { calls: [], sum: { calls: 0, hit: 0, miss: 0, out: 0, cny: 0, peakCalls: 0 } };
}

function loadCostBook() {
  try {
    const raw = localStorage.getItem(costKey());
    if (!raw) return emptyCostBook();
    const book = JSON.parse(raw);
    if (!book || !Array.isArray(book.calls) || !book.sum) return emptyCostBook();
    return book;
  } catch (e) { return emptyCostBook(); }
}

function saveCostBook(book) {
  try { localStorage.setItem(costKey(), JSON.stringify(book)); } catch (e) {}
}

/* 记一次调用：usage 来自 /chat 的 usage 块或 /summarize 响应里的 usage */
function recordUsage(usage, provider, model, kind) {
  if (!usage || !Number.isFinite(Number(usage.inputTokens) + Number(usage.outputTokens))) return null;
  const t = Date.now();
  const price = priceForModel(model, t);
  const hit = Math.max(0, Number(usage.cacheReadTokens) || 0);
  const input = Math.max(0, Number(usage.inputTokens) || 0);
  const miss = Math.max(0, input - hit);
  const out = Math.max(0, Number(usage.outputTokens) || 0);
  const cny = (hit * price.hit + miss * price.miss + out * price.out) / 1e6;
  const entry = {
    t, kind: kind || 'chat', provider: provider || '', model: price.model, label: price.label,
    hit, miss, out, cny, offPeak: price.offPeak,
  };
  const book = loadCostBook();
  book.calls.push(entry);
  if (book.calls.length > COST_MAX_CALLS) book.calls = book.calls.slice(book.calls.length - COST_MAX_CALLS);
  const sum = book.sum;
  sum.calls += 1; sum.hit += hit; sum.miss += miss; sum.out += out; sum.cny += cny;
  if (!price.offPeak) sum.peakCalls += 1;
  saveCostBook(book);
  renderCostBar();
  return entry;
}

function fmtTokens(n) {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(Math.round(n));
}

function fmtCny(v) {
  v = Number(v) || 0;
  if (v === 0) return '¥0';
  if (v < 0.0001) return '¥' + v.toFixed(6);
  if (v < 0.01) return '¥' + v.toFixed(4);
  return '¥' + v.toFixed(v < 1 ? 3 : 2);
}

function renderCostBar() {
  const el = $('#costText');
  if (!el) return;
  const book = loadCostBook();
  const s = book.sum;
  if (!s.calls) { el.textContent = '本剧本还没有产生费用'; return; }
  el.innerHTML = '本剧本 ≈ <b>' + fmtCny(s.cny) + '</b> · ' + s.calls + ' 次调用 · 输入 ' + fmtTokens(s.hit + s.miss)
    + ' / 输出 ' + fmtTokens(s.out) + (s.peakCalls ? ' · 峰时 ' + s.peakCalls + ' 次' : '');
}

/* ---------- AI 对话记忆：按剧本存在 localStorage，关掉再打开不丢 ---------- */
const CHAT_MAX = 80;   /* 每个剧本最多留 80 条（约 40 轮），超了就丢最早的 */

function chatKey() {
  return 'coc-notes:chat:' + ((S.doc && S.doc.id) || 'none');
}

function loadChat() {
  try {
    const raw = localStorage.getItem(chatKey());
    if (!raw) return [];
    const list = JSON.parse(raw);
    if (!Array.isArray(list)) return [];
    return list
      .filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string')
      .map(m => ({ role: m.role, content: m.content }));
  } catch (e) { return []; }
}

function saveChatNow() {
  try {
    const list = (S.chat || []).map(m => ({ role: m.role, content: String(m.content || '') }));
    const trimmed = list.length > CHAT_MAX ? list.slice(list.length - CHAT_MAX) : list;
    const key = chatKey();
    if (!trimmed.length) localStorage.removeItem(key);
    else localStorage.setItem(key, JSON.stringify(trimmed));
  } catch (e) { /* 配额满了或隐私模式，静默失败，不影响主流程 */ }
}

function renderChat() {

      };

async function aiChat(messages, onDelta, onUsage) {
  const ctrl = new AbortController();
  S.abort = ctrl;
  const r = await fetch(AI_BASE + '/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ messages, stream: true, temperature: settings.temp }, currentAiModel() ? { provider: currentAiModel().provider, model: currentAiModel().model } : {})),
    signal: ctrl.signal,
  });
  if (!r.ok) throw new Error('HTTP ' + r.status + '：' + (await r.text()).slice(0, 200));
  const reader = r.body.getReader();
  const dec = new TextDecoder();
  let buf = '', full = '', finished = false, usage = null;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      const s = line.trim();
      if (!s.startsWith('data:')) continue;
      const d = s.slice(5).trim();
      if (!d) continue;
      if (d === '[DONE]') { buf = ''; finished = true; break; }
      let j = null;
      try { j = JSON.parse(d); } catch (e) { continue; } // 忽略半包
      if (j.usage) { usage = j.usage; if (onUsage) { try { onUsage(j.usage); } catch (e) {} } }
      if (j.error) throw new Error((j.error && j.error.message) || '模型调用失败');
      const ch = j.choices?.[0]?.delta || {};
      const t = ch.content || '';
      if (t) { full += t; onDelta(t, full); }
    }
  }
  return { text: full, usage };
}

async function sendChat(presetText) {
  if (S.streaming) { S.abort && S.abort.abort(); return; }
  const input = $('#aiInput');
  const text = (presetText || input.value).trim();
  if (!text) return;
  const tid = ctxTargetId();
  if (!tid) { toast('先在左边选中一条笔记'); return; }
  if (!input.hidden && !presetText) input.value = '';

  S.chat.push({ role: 'user', content: text });
  const reply = { role: 'assistant', content: '' };
  S.chat.push(reply);
  renderChat();
  saveChatNow();   /* 先记住「我问过什么」，这样就算中途关掉面板也不丢 */

  const { text: ctxText, tokens } = ctxStats();
  const warn = tokens > 40000 ? '（提示：上下文较大，已接近模型上限）' : '';
  const messages = [
    { role: 'system', content: SYS_PROMPT },
    { role: 'system', content: ctxText + (warn ? '\n\n' + warn : '') },
    ...S.chat.slice(0, -1).map(m => ({ role: m.role, content: m.content })),
  ];

  const pick = currentAiModel() || {};
  let charged = null;
  S.streaming = true;
  $('#btnSend').textContent = '停止';
  const box = $('#msgs');
  try {
    await aiChat(messages, (delta, full) => {
      reply.content = full;
      const last = box.lastElementChild;
      if (last) {
        const b = last.querySelector('.bubble');
        if (b) { b.innerHTML = mdToHtml(full); hydrateImages(b); }
      }
      box.scrollTop = box.scrollHeight;
    }, (u) => {
      charged = recordUsage(u, pick.provider, pick.model, 'chat');
      if (charged) reply.usage = { hit: charged.hit, miss: charged.miss, out: charged.out, cny: charged.cny, offPeak: charged.offPeak, label: charged.label };
    });
    renderChat();
  } catch (e) {
    if (e.name === 'AbortError') { toast('已停止'); }
    else {
      reply.content = reply.content || '';
      toast('请求失败：' + e.message, 4200);
      S.chat.push({ role: 'assistant', content: '⚠️ 请求失败：' + e.message });
    }
    renderChat();
  } finally {
    saveChatNow();   /* 流式结束（成功/失败/中断）都落盘一遍 */
    S.streaming = false;
    S.abort = null;
    $('#btnSend').textContent = '发送';
  }
}

function saveAsBranch(text) {

  if (!tid) return;
  const firstLine = text.split('\n').map(s => s.replace(/^[#>*\-\s]+/, '').trim()).find(Boolean) || 'AI 建议';

  nodeOf(tid).collapsed = false;
  S.sel = n.id;
  renderTree(); centerOn(n.id); flash(n.id); scheduleSave();
  toast('已存为「' + title + '」下的新枝干');
}

function applyAiText(text) {

/* 一次性迁移：把「已有摘要 + 内容哈希匹配」的条目锁上（老版本生成的大纲都是未锁的） */
function migrateSummaryLocks() {
  try {
    const FLAG = 'coc-notes:lockMigrated:v1';
    if (localStorage.getItem(FLAG)) return;
    let changed = 0;
    for (const n of Object.values(S.doc.nodes)) {
      if (n.summary && !n.summaryLocked && n.hash && n.hash === hashOf(n.content)) { n.summaryLocked = true; changed++; }
    }
    localStorage.setItem(FLAG, '1');
    if (changed) { scheduleSave(); devLog({ type: 'summary-lock-migrated', changed }); }
  } catch (e) {}
}

function needSummary(n) {
  if (!n.content.trim()) return false;
  if (n.summaryLocked) return false;
  return !n.summary || n.hash !== hashOf(n.content);
}

async function summarizeOne(n) {
  const body = {
    temperature: 0.3,
    // 留足 token：开启「思考强度」时思考过程也占预算，给少了正文会空。
    maxTokens: 800,
    messages: [
      { role: 'system', content: '你是剧本编辑。把给定的 COC 剧本片段压成一句中文大纲。要求：30–60 字；格式为「发生了什么 → 玩家要做什么 / 有什么风险」；只输出这一句，不要引号、不要解释。' },
      { role: 'user', content: `标题：${n.title || '未命名'}\n类型：${typeOf(n.type).name}\n\n正文：\n${n.content.slice(0, 6000)}` },
    ],
  };
  const pick = currentAiModel();
  if (pick) { body.provider = pick.provider; body.model = pick.model; }
  const r = await fetch(AI_BASE + '/summarize', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    signal: AbortSignal.timeout(180000),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.usage) recordUsage(j.usage, j.provider || (pick && pick.provider), j.model || (pick && pick.model), 'summarize');
  const txt = (j.choices?.[0]?.message?.content || '').trim().replace(/^["「『]|["」』]$/g, '');
  return norm(txt);
}

async function runSummary() {
  const all = Object.values(S.doc.nodes);
  const todo = all.filter(needSummary);
  if (!todo.length) { toast('所有大纲都是新的、且都已锁定 ✓'); return; }
  const btn = $('#btnSummary');
  btn.disabled = true;
  let done = 0, fail = 0;
  const queue = [...todo];
  const worker = async () => {
    while (queue.length) {
      const n = queue.shift();
      btn.innerHTML = `<span class="spin"></span> ${done}/${todo.length}`;
      try {
        const s = await summarizeOne(n);
        if (s) { n.summary = s; n.hash = hashOf(n.content); n.summaryLocked = true; }   /* 生成即锁定：下次「总结」不再重算 */
        else fail++;
      } catch (e) { fail++; }
      done++;
      renderTree(); scheduleSave();
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  btn.disabled = false;
  btn.textContent = '总结';
  Undo.push(true);
  toast(fail ? `完成 ${done - fail} 条，失败 ${fail} 条（已自动锁定）` : `已更新 ${done} 条大纲并锁定 ✓`);
}

   ========================================================= */
const safeFile = s => String(s || '未命名').replace(/[\\/:*?"<>|\r\n]/g, '_').slice(0, 60);
const IMG_RE = /dshimg:([a-z0-9]+)/gi;

function buildMarkdown(doc) {
  const lines = [];
  const N = doc.nodes;
  const walk = (id, depth) => {
    const n = N[id];
    if (!n) return;
    const h = '#'.repeat(Math.min(6, depth + 1));
    lines.push(h + ' ' + (n.title || '未命名'));
    const meta = [];
    if (n.type !== 'none') meta.push('**类型**：' + typeOf(n.type).name);
    if (n.summary) meta.push('**一句话**：' + n.summary);
    if (meta.length) lines.push('', '> ' + meta.join(' ｜ '));
    if (n.content) lines.push('', n.content);
    lines.push('');
    for (const c of n.children) walk(c, depth + 1);
  };
  for (const r of doc.rootIds) walk(r, 0);
  // 导出的 .md 就是协议文件：开头写 front matter，外部编辑后可以原样再导入（协议 §13）
  const fm = '---\n枝条笔记协议: 1\n名称: ' + String(doc.name || '').replace(/\s*\n\s*/g, ' ') + '\n---\n\n';
  return fm + lines.join('\n').replace(/\n{3,}/g, '\n\n');
}

function usedAssetIds(md) {
  const out = new Set();
  for (const m of md.matchAll(IMG_RE)) out.add(m[1]);
  return out;
}

async function blobToDataURL(blob) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = rej;
    fr.readAsDataURL(blob);
  });
}

function download(data, filename, mime) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* 内嵌在 DSH 面板里的下载不一定被放行，优先让宿主直接写盘到「文档/枝条笔记导出/<文档名>/」 */
async function blobToBase64(blob) {
  const url = await blobToDataURL(blob);
  const text = String(url);
  return text.slice(text.indexOf(',') + 1);
}

async function saveToHostFolder(payload) {
  const res = await fetch(AI_BASE + '/save-export', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok || !data || !data.ok) throw new Error((data && (data.error || data.message)) || ('保存失败：HTTP ' + res.status));
  return data;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('已复制');
    return;
  } catch (e) {
    // 嵌套视图里 clipboard 可能没有权限，退回选中复制
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  toast(ok ? '已复制' : '复制失败，请手动选中文本');
}

async function exportMarkdown() {
  if (!S.doc) return;
  const md = buildMarkdown(S.doc);
  const ids = usedAssetIds(md);
  const assets = [];
  for (const id of ids) {
    const a = await Store.get('assets', id);
    if (a) {
      const ext = (a.mime || '').includes('png') ? '.png' : (a.mime || '').includes('webp') ? '.webp' : '.jpg';
      const base = safeFile((a.name || id).replace(/\.[^.]+$/, ''));
      assets.push({ id, blob: a.blob, filename: base + '_' + id.slice(-4) + ext });
    }
  }
  const nameMap = new Map(assets.map(a => [a.id, a.filename]));
  const withPaths = md.replace(IMG_RE, (m, id) => nameMap.has(id) ? 'assets/' + nameMap.get(id) : m);

  // 面板内嵌在 DSH 里：优先让宿主把文件直接写到「文档/枝条笔记导出/<文档名>/」
  try {
    const hostAssets = [];
    for (const a of assets) hostAssets.push({ filename: a.filename, base64: await blobToBase64(a.blob) });
    const saved = await saveToHostFolder({
      name: S.doc.name,
      filename: safeFile(S.doc.name) + '.md',
      text: withPaths,
      assets: hostAssets,
    });
    toast(`已导出到 ${saved.dir}` + (hostAssets.length ? `（含 ${hostAssets.length} 张图）` : ''));
    return;
  } catch (e) {
    console.warn('宿主导出失败，改用浏览器目录/下载：', e);
  }

  if (window.showDirectoryPicker) {
    try {
      const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
      const fh = await dir.getFileHandle(safeFile(S.doc.name) + '.md', { create: true });
      const w = await fh.createWritable();
      await w.write(withPaths);
      await w.close();
      if (assets.length) {
        const adir = await dir.getDirectoryHandle('assets', { create: true });
        for (const a of assets) {
          const h = await adir.getFileHandle(a.filename, { create: true });
          const ww = await h.createWritable();
          await ww.write(a.blob);
          await ww.close();
        }
      }
      toast(`已导出：${safeFile(S.doc.name)}.md` + (assets.length ? ` + assets/（${assets.length} 张图）` : ''));
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
      console.warn('目录导出失败，改用下载：', e);
    }
  }
  // 兜底：图片转 data URI 内嵌
  let out = md;
  for (const a of assets) {
    const url = await blobToDataURL(a.blob);
    out = out.replace('dshimg:' + a.id, url);
  }
  download(out, safeFile(S.doc.name) + '.md', 'text/markdown;charset=utf-8');
  toast('已下载 .md（图片已内嵌）');
}

async function exportJson() {

/* =========================================================
   Markdown 导入（笔记协议 v1，见 笔记协议-v1.md）
   解析器放在下面的标记块里：不依赖 DOM / 全局状态，可被 Node 单测直接抽取。
   ========================================================= */
/* ===== MARKDOWN IMPORT BEGIN ===== */
/* 类型对照表：中文名 ↔ 英文 id（协议 §6） */
const MD_TYPES = [
  ['剧情', 'plot'], ['人物', 'npc'], ['地点', 'place'], ['判定', 'check'],
  ['线索', 'clue'], ['神话', 'mythos'], ['道具', 'item'], ['未分类', 'none'],
];
function mdTypeOf(raw) {
  const s = String(raw || '').trim();
  if (!s) return { type: 'none', known: true };
  for (const [cn, id] of MD_TYPES) if (s === cn) return { type: id, known: true };
  const low = s.toLowerCase();
  for (const [cn, id] of MD_TYPES) if (id === low) return { type: id, known: true };
  return { type: 'none', known: false };
}
/* 图片 data URI 扫描：解析器只找出位置，转存成 assets 由导入流程做（协议 §9） */
const MD_DATA_IMG_RE = /!\[([^\]]*)\]\((data:image\/([a-zA-Z0-9.+-]+);base64,([^)\s]+))\)/g;
function scanDataImages(text) {
  const out = [];
  const re = new RegExp(MD_DATA_IMG_RE.source, 'g');
  let m;
  while ((m = re.exec(String(text || '')))) {
    out.push({ alt: m[1], mime: m[3], base64: m[4], raw: m[0], offset: m.index, length: m[0].length });
  }
  return out;
}
/* 引用块：去掉行首的 `>` 标记 */
function mdUnquote(line) { return String(line).replace(/^\s*>\s?/, ''); }
/* 元信息字段（协议 §5）：字段必须位于（去掉 > 后的）行首，`**` 可省，中英文冒号均可 */
const MD_TYPE_RE = /^(?:\*\*)?(类型|type)(?:\*\*)?\s*[:：]\s*([\s\S]*)$/i;
const MD_SUM_RE = /^(?:\*\*)?(一句话|摘要|summary)(?:\*\*)?\s*[:：]\s*([\s\S]*)$/i;
const MD_SEP_RE = /[｜|;；]/;
/* 整块解析一个引用块：命中可识别字段返回字段个数；返回 0 表示「不是元信息」（协议 §5） */
function mdParseMetaBlock(lines, node, warnings) {
  let hits = 0;
  for (const line of lines) {
    const body = mdUnquote(line);
    const mt = body.match(MD_TYPE_RE);
    if (mt) {
      hits++;
      const val = mt[2].split(MD_SEP_RE)[0];
      const r = mdTypeOf(val);
      node.type = r.type;
      if (!r.known) warnings.push('未知类型「' + String(val).trim() + '」，按未分类导入');
      // 同一行：类型之后若还有分隔符，继续找「一句话」（值取冒号后整行剩余文字）
      const cut = mt[2].search(MD_SEP_RE);
      if (cut >= 0) {
        const ms = mt[2].slice(cut + 1).trimStart().match(MD_SUM_RE);
        if (ms) { node.summary = ms[2].trim(); hits++; }
      }
      continue;
    }
    const ms = body.match(MD_SUM_RE);
    if (ms) { node.summary = ms[2].trim(); hits++; }
  }
  return hits;
}
/* 纯解析器：Markdown 文本 → { name, roots, count, warnings }
   roots 里的节点结构：{ title, type, summary, content, children } */
function parseBranchMarkdown(text) {
  const warnings = [];
  const lines = String(text || '').replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').split('\n');
  const NAME_KEYS = new Set(['名称', '名字', 'name', 'title']);
  const VER_KEYS = new Set(['枝条笔记协议', '协议', '协议版本', 'protocol', 'version']);
  let i = 0, name = '';

  /* 1) 可选 front matter（协议 §3）：文件第一行必须是 --- */
  if (lines.length && lines[0].trim() === '---') {
    let end = -1;
    for (let j = 1; j < lines.length; j++) if (lines[j].trim() === '---') { end = j; break; }
    if (end > 0) {
      for (let j = 1; j < end; j++) {
        const m = lines[j].match(/^\s*([^:：]+?)\s*[:：]\s*(.*)$/);
        if (!m) continue;
        const key = m[1].replace(/\*/g, '').trim().toLowerCase();
        const val = m[2].trim();
        if (NAME_KEYS.has(key)) name = val;
        else if (VER_KEYS.has(key) && val && !/^(v?1|枝条笔记\s*v?1)$/i.test(val)) {
          warnings.push('未知协议版本「' + val + '」，按 v1 解析');
        }
        // 其余键忽略（协议 §3：不报错）
      }
      i = end + 1;
    }
  }

  /* 2) 标题 = 节点、级别 = 层级（协议 §4）；标题后第一个非空块若是含字段的引用块 → 元信息（协议 §5）；
        代码围栏内不解析（协议 §8） */
  const roots = [];
  const stack = [];          // [{ level, node }]
  let cur = null;            // 当前节点
  let lookMeta = false;      // 处于「标题后、第一块内容前」，等待判定是否元信息
  let inFence = false;
  let buf = [];              // 当前节点正文行缓冲

  const flush = () => {
    if (!cur) { buf = []; return; }
    let a = 0, b = buf.length;
    while (a < b && !buf[a].trim()) a++;
    while (b > a && !buf[b - 1].trim()) b--;
    cur.content = buf.slice(a, b).join('\n');
    buf = [];
  };

  const isFenceOpen = line => /^\s{0,3}(`{3,}|~{3,})/.test(line);
  const isFenceClose = line => /^\s{0,3}(`{3,}|~{3,})\s*$/.test(line);

  for (let k = i; k < lines.length; k++) {
    const line = lines[k];
    if (inFence) {
      if (isFenceClose(line)) inFence = false;
      buf.push(line);
      continue;
    }
    if (isFenceOpen(line)) {
      lookMeta = false;      // 代码块属于正文，里面没有元信息也没有标题
      inFence = true;
      buf.push(line);
      continue;
    }
    const hm = line.match(/^(#{1,6})(.*)$/);
    if (hm) {
      const level = hm[1].length;
      const rest = hm[2];
      const spaced = rest === '' || /^[ \t]/.test(rest);
      // 协议 §4：`#` 必须在行首；`#话题` 不是标题；`##`（空标题）与 `##灰墙庄园` 宽容接受
      if (spaced || level >= 2) {
        flush();
        let title = rest.trim().replace(/[ \t]+#+[ \t]*$/, '').replace(/^#+$/, '').trim();
        if (!title) title = '未命名';
        const node = { title, type: 'none', summary: '', content: '', children: [] };
        while (stack.length && stack[stack.length - 1].level >= level) stack.pop();
        if (stack.length) stack[stack.length - 1].node.children.push(node);
        else roots.push(node);
        stack.push({ level, node });
        cur = node;
        lookMeta = true;
        buf = [];
        continue;
      }
    }
    if (lookMeta) {
      if (!line.trim()) continue;               // 标题与第一块内容之间允许空行
      if (/^\s*>/.test(line)) {
        let j = k;
        const block = [];
        while (j < lines.length && /^\s*>/.test(lines[j])) { block.push(lines[j]); j++; }
        if (mdParseMetaBlock(block, cur, warnings) > 0) {
          lookMeta = false;                     // 命中字段：整块都是元信息，不进正文
        } else {
          for (const q of block) buf.push(q);   // 没有可识别字段：整块原样当正文
          lookMeta = false;
        }
        k = j - 1;
        continue;
      }
      lookMeta = false;                         // 第一块不是引用块 → 后面即使有引用也不当元信息
      buf.push(line);
      continue;
    }
    buf.push(line);
  }
  flush();

  let count = 0;
  const countNode = n => { count++; for (const c of n.children) countNode(c); };
  for (const r of roots) countNode(r);
  return { name: name.trim(), roots, count, warnings };
}
/* ===== MARKDOWN IMPORT END ===== */

/* 把正文里的 data URI 图片转存为本地 assets（协议 §9），返回替换后的正文 */
async function storeDataImages(content) {
  const text = String(content || '');
  const matches = scanDataImages(text);
  if (!matches.length) return text;
  let out = '', last = 0;
  for (const m of matches) {
    let blob = null;
    try {
      const bin = atob(m.base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      blob = new Blob([bytes], { type: m.mime });
    } catch (e) { /* 解码失败就保留原样 */ }
    if (!blob) continue;
    const id = uid();
    const ext = (m.mime.split('/')[1] || 'png').replace(/[^a-z0-9]/gi, '') || 'png';
    await Store.put('assets', {
      id, name: (norm(m.alt) || '图片') + '.' + ext, mime: m.mime,
      width: 0, height: 0, blob, at: Date.now(),
    });
    out += text.slice(last, m.offset) + '![' + m.alt + '](dshimg:' + id + ')';
    last = m.offset + m.length;
  }
  out += text.slice(last);
  return out;
}

/* 导入 Markdown（协议 §10）：每次都新建一本笔记，不覆盖已有笔记 */
function importMarkdown() {
  const old = document.getElementById('mdImportInput');
  if (old) old.remove();
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.id = 'mdImportInput';
  inp.accept = '.md,.markdown,.txt,text/markdown,text/plain';
  inp.style.display = 'none';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    try {
      if (!f) return;
      const parsed = parseBranchMarkdown(await f.text());
      if (!parsed.roots.length) {
        toast('没有找到任何 # 标题，无法导入', 3500);
        return;
      }
      const base = (f.name || '').replace(/\.(md|markdown|txt)$/i, '');
      const wanted = (parsed.name || '').trim() || base.trim() || '导入的笔记';
      // 重名自动加「（2）（3）…」
      const used = new Set((await Store.all('docs')).map(d => d.name));
      let docName = wanted, n = 2;
      while (used.has(docName)) docName = wanted + '（' + (n++) + '）';

      const doc = newDoc(docName);
      let count = 0;
      const walk = async (items, parentId) => {
        for (const it of items) {
          const content = await storeDataImages(it.content);
          const node = makeNode(parentId);
          node.title = it.title || '未命名';
          node.type = it.type || 'none';
          node.summary = it.summary || '';
          node.content = content;
          node.hash = hashOf(content);
          node.ts = Date.now();
          doc.nodes[node.id] = node;
          if (parentId) doc.nodes[parentId].children.push(node.id);
          else doc.rootIds.push(node.id);
          count++;
          await walk(it.children || [], node.id);
        }
      };
      await walk(parsed.roots, null);

      await saveNow();          // 先把当前剧本存好，再切到导入的新剧本
      S.doc = doc;
      S.sel = doc.rootIds[0] || null;
      S.focusId = null;
      S.edit = null;
      S.ctxOff.clear();
      S.placeAct = 'all';
      Undo.reset(); renderTree(); resetView(); refreshNbName(); await saveNow();
      toast('已导入「' + doc.name + '」：' + count + ' 条笔记 · ' + doc.rootIds.length + ' 根枝条', 3200);
      if (parsed.warnings.length) console.warn('[Markdown 导入]', parsed.warnings);
    } catch (e) {
      toast('导入失败：' + ((e && e.message) || e), 3500);
    } finally {
      inp.remove();
    }
  };
  inp.oncancel = () => inp.remove();
  document.body.appendChild(inp);
  inp.click();
}

function seedSample(doc) {
  const prevDoc = S.doc;
  S.doc = doc;
  /* 第一幕：灰墙庄园 → 门廊（子地点） */
  const a1 = addNode(null, { title: '第一幕 · 雨夜抵达', type: 'plot', content: '1925 年，阿卡姆郊外。调查员受老友霍华德之托，驱车抵达「灰墙庄园」。\n\n- 雨大，车灯只能照出十米\n- 大门虚掩，门廊下有一把没带走的伞' });
  const m1 = addNode(a1.id, { title: '灰墙庄园', type: 'place', content: '三层砖石宅邸，外墙爬满枯死的常春藤。门厅的挂钟停在十一点四十分。' });
  const p1 = addNode(m1.id, { title: '门廊', type: 'place', content: '正门前的半开放长廊，地砖碎了一角。' });

async function renameDoc() {
  const name = prompt('剧本名', S.doc.name);
  if (!name) return;
  S.doc.name = norm(name); touch();
  await saveNow(); refreshNbName(); toast('已改名');
}

async function deleteDoc() {
  if (!confirm('删除「' + S.doc.name + '」？只删本地这一份，导出的 .md 不受影响。')) return;
  const gone = S.doc;
  await Store.del('docs', gone.id);
  /* 顺手清掉这部剧的历史快照，别留下孤儿数据 */
  const snaps = (await Store.all('snaps')).filter(s => s.docId === gone.id);
  for (const s of snaps) await Store.del('snaps', s.id);
  const rest = await Store.all('docs');
  S.doc = null;   // 关键：下面 openDoc / createDoc 开场都会 saveNow()，不置空会把刚删的剧本又写回去
  if (rest.length) { await openDoc(rest[0].id); }
  else { await createDoc(); }
  toast('已删除「' + gone.name + '」');
}

/* =========================================================
   21. 地点模式（地点归拢 · 跨幕合并 · 子地点嵌套）
   ========================================================= */

/* ---------- 21.1 纯索引：只依赖 doc，可单独抽出测试 ---------- */
/* ===== PLACE INDEX BEGIN ===== */
function buildPlaceIndex(doc) {
  const PLACE = 'place';
  const ACT_RE = /(第[零一二三四五六七八九十百千万\d]+[幕章场]|序幕|楔子|尾声|终幕|\bact\s*\d+)/i;
  const nodes = (doc && doc.nodes) || {};
  const rootIds = (doc && doc.rootIds) || [];
  const nrm = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();

  /* 文档顺序（含未挂到根上的节点），用于稳定排序 */
  const order = new Map();
  const seen = new Set();
  let seq = 0;
  const walkOrder = id => {
    if (seen.has(id)) return;
    const n = nodes[id];
    if (!n) return;
    seen.add(id);
    order.set(id, seq++);
    for (const c of (n.children || [])) walkOrder(c);
  };
  for (const r of rootIds) walkOrder(r);
  for (const id of Object.keys(nodes)) walkOrder(id);
  const ordOf = n => (order.has(n.id) ? order.get(n.id) : 1e12);

  const isPlace = n => !!n && n.type === PLACE;
  const titleOf = n => nrm(n.title) || '未命名地点';
  const keyOf = n => {
    const t = nrm(n.title);
    return t ? 't:' + t.toLowerCase() : 'id:' + n.id;
  };
  const parentNode = n => (n && n.parentId ? nodes[n.parentId] || null : null);

  /* 幕：最近的、标题像「第X幕 / 第X章 / 序幕」的祖先；找不到则退到最顶层祖先 */
  const actCache = new Map();
  const actOf = n => {
    if (actCache.has(n.id)) return actCache.get(n.id);
    let cur = parentNode(n);
    let topRoot = null;
    let hit = null;
    while (cur) {
      const t = nrm(cur.title);
      if (!topRoot && !cur.parentId) topRoot = cur;
      if (t && ACT_RE.test(t)) { hit = cur; break; }
      cur = parentNode(cur);
    }
    const act = (hit || topRoot) && !isPlace(hit || topRoot) ? (hit || topRoot) : null;
    const res = act
      ? { key: 'a:' + act.id, id: act.id, title: nrm(act.title) || '未命名幕', order: ordOf(act) }
      : { key: '__none__', id: null, title: '（未分幕）', order: 1e12 };
    actCache.set(n.id, res);
    return res;
  };

  const nearestPlaceAncestor = n => {
    let cur = parentNode(n);
    while (cur) {
      if (isPlace(cur)) return cur;
      cur = parentNode(cur);
    }
    return null;
  };

  /* 按地名分组：同名地点跨幕合并；没名字的按 id 各算一个 */
  const groups = new Map();
  for (const id of Object.keys(nodes)) {
    const n = nodes[id];
    if (!isPlace(n)) continue;
    const k = keyOf(n);
    let g = groups.get(k);
    if (!g) {
      g = {
        key: k, title: titleOf(n), order: ordOf(n), occ: [], itemCount: 0,
        sections: new Map(), descs: new Map(), parentCounts: new Map(),
        parentKey: null, parentTitle: '', children: [],
      };
      groups.set(k, g);
    }
    g.order = Math.min(g.order, ordOf(n));
    g.occ.push({ node: n, order: ordOf(n), act: actOf(n) });
  }
  for (const g of groups.values()) {
    g.occ.sort((a, b) => a.order - b.order);
    for (const o of g.occ) {
      const p = nearestPlaceAncestor(o.node);
      /* 记下「这一次出现时」直接挂在哪张地点卡下，供按幕筛选使用 */
      if (!p) { o.parentKey = null; continue; }
      const pk = keyOf(p);
      if (pk === g.key) { o.parentKey = null; continue; }
      o.parentKey = pk;
      g.parentCounts.set(pk, (g.parentCounts.get(pk) || 0) + 1);
    }
  }

  /* 上级地点：出现次数最多者；并列取在文档里更早出现的；最后破环 */
  const parentOf = new Map();
  for (const g of groups.values()) {
    let best = null, bestC = -1, bestO = Infinity;
    for (const [pk, c] of g.parentCounts) {
      const pg = groups.get(pk);
      const o = pg ? pg.order : 1e12;
      if (c > bestC || (c === bestC && o < bestO)) { best = pk; bestC = c; bestO = o; }
    }
    parentOf.set(g.key, best);
  }
  for (const g of groups.values()) {
    const path = new Set();
    let cur = g.key;
    let guard = 0;
    while (cur && guard++ < 10000) {
      if (path.has(cur)) { parentOf.set(cur, null); break; }
      path.add(cur);
      cur = parentOf.get(cur) || null;
    }
  }
  for (const g of groups.values()) {
    const pk = parentOf.get(g.key) || null;
    g.parentKey = pk && groups.has(pk) ? pk : null;
    g.parentTitle = g.parentKey ? groups.get(g.parentKey).title : '';
    if (g.parentKey) groups.get(g.parentKey).children.push(g);
  }
  for (const g of groups.values()) g.children.sort((a, b) => a.order - b.order);
  const topGroups = [...groups.values()].filter(g => !g.parentKey).sort((a, b) => a.order - b.order);

  /* 下游枝干：按「幕」分组；遇到子地点就停，它自己是一张卡 */
  const sortItems = items => {
    items.sort((a, b) => a.order - b.order);
    for (const it of items) sortItems(it.children);
  };
  const secCache = new Map();
  const secFor = (g, act) => {
    const k = g.key + '\u0000' + act.key;
    let s = secCache.get(k);
    if (!s) {
      s = { key: act.key, id: act.id, title: act.title, order: act.order, roots: [] };
      secCache.set(k, s);
      g.sections.set(act.key, s);
    }
    return s;
  };
  for (const g of groups.values()) {
    for (const o of g.occ) {
      secFor(g, o.act); // 每一幕都建一节，即使这一幕没有枝干
      const txt = String(o.node.content || '').trim();
      if (txt) {
        const dk = nrm(txt).slice(0, 200);
        const rec = g.descs.get(dk) || { text: o.node.content, acts: [] };
        if (!rec.acts.some(a => a.key === o.act.key)) rec.acts.push(o.act);
        g.descs.set(dk, rec);
      }
      const walkItems = (parentNode, parentItem) => {
        for (const cid of (parentNode.children || [])) {
          const cn = nodes[cid];
          if (!cn || isPlace(cn)) continue;
          const sec = secFor(g, actOf(cn));
          const item = { id: cn.id, node: cn, order: ordOf(cn), children: [] };
          (parentItem ? parentItem.children : sec.roots).push(item);
          g.itemCount++;
          walkItems(cn, item);
        }
      };
      walkItems(o.node, null);
    }
    for (const s of g.sections.values()) sortItems(s.roots);
  }

  let infoCount = 0, mergedCount = 0;
  for (const g of groups.values()) {
    infoCount += g.itemCount;
    if (g.sections.size > 1) mergedCount++;
  }
  return { groups, topGroups, placeCount: groups.size, infoCount, mergedCount };
}

/* 地点视图「只看某一幕」要用的幕清单：按文档顺序，没分幕的排最后 */
function placeActList(idx) {
  const map = new Map();
  if (idx) {
    for (const g of idx.groups.values()) {
      for (const sec of g.sections.values()) {
        if (!map.has(sec.key)) map.set(sec.key, { key: sec.key, id: sec.id, title: sec.title, order: sec.order });
      }
    }
  }
  return [...map.values()].sort((a, b) => (a.order - b.order) || String(a.title).localeCompare(String(b.title)));
}

/* 按幕筛选：返回与 buildPlaceIndex 同形状的子集；actKey === 'all' 原样返回。
   规则：只留该幕的地点卡片；地点描述只留该幕；只留该幕的枝干；子地点也按「这一幕挂在谁下面」过滤。 */
function placeIndexForAct(idx, actKey) {
  if (!idx) return { groups: new Map(), topGroups: [], placeCount: 0, infoCount: 0, mergedCount: 0 };
  if (actKey === 'all') return idx;
  const countItems = list => {
    let c = 0;
    const walk = arr => { for (const it of arr) { c++; walk(it.children); } };
    walk(list);
    return c;
  };
  const built = new Map();   // 地点 key -> 过滤后的分组；不可见为 null
  const building = new Set();
  const build = g => {
    if (built.has(g.key)) return built.get(g.key);
    if (building.has(g.key)) return null; // 防御：父链成环时不再递归
    building.add(g.key);
    const sec = g.sections.get(actKey) || null;
    const sections = new Map();
    if (sec && sec.roots.length) sections.set(actKey, sec);
    const descs = new Map();
    for (const [dk, d] of g.descs) {
      const acts = d.acts.filter(a => a.key === actKey);
      if (acts.length) descs.set(dk, { text: d.text, acts });
    }
    const children = [];
    for (const c of g.children) {
      /* 子地点必须「在这一幕里确实挂在本地点下面」才跟过来 */
      if (!c.occ.some(o => o.act.key === actKey && o.parentKey === g.key)) continue;
      const cf = build(c);
      if (cf) children.push(cf);
    }
    building.delete(g.key);
    const visible = descs.size > 0 || sections.size > 0 || children.length > 0;
    const out = visible ? {
      key: g.key, title: g.title, order: g.order,
      occ: g.occ.filter(o => o.act.key === actKey),
      itemCount: sec ? countItems(sec.roots) : 0,
      sections, descs, parentCounts: new Map(),
      parentKey: g.parentKey, parentTitle: g.parentTitle, children,
    } : null;
    built.set(g.key, out);
    return out;
  };
  for (const g of idx.topGroups) build(g);
  /* 上级地点在这一幕不可见、或这一幕把它挂到了别的地点下：仍可见的子地点提升为顶层卡片 */
  for (const g of idx.groups.values()) {
    if (built.has(g.key)) continue;
    if (!g.occ.some(o => o.act.key === actKey)) { built.set(g.key, null); continue; }
    const out = build(g);
    if (out) { out.parentKey = null; out.parentTitle = ''; }
  }
  const groups = new Map();
  for (const g of idx.groups.values()) {
    const f = built.get(g.key);
    if (f) groups.set(g.key, f);
  }
  const topGroups = [...groups.values()].filter(g => !g.parentKey).sort((a, b) => a.order - b.order);
  let infoCount = 0;
  for (const g of groups.values()) infoCount += g.itemCount;
  const mergedCount = [...groups.values()].filter(g => g.sections.size > 1).length;
  return { groups, topGroups, placeCount: groups.size, infoCount, mergedCount };
}
/* ===== PLACE INDEX END ===== */

/* ---------- 21.2 渲染 ---------- */
function placeExcerpt(n) {
  const sum = norm(n.summary || '');
  if (sum) return sum;
  const plain = String(n.content || '')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '［图］')
    .replace(/\[\[([^\]|]+)(?:\|[^\]]*)?\]\]/g, '$1')
    .replace(/[#>*`_~|]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return plain.length > 96 ? plain.slice(0, 96) + '…' : plain;
}

function countPlaceItems(list) {
  let c = 0;
  const walk = arr => { for (const it of arr) { c++; walk(it.children); } };
  walk(list);
  return c;
}

/* 一条信息行（地点模式里的 .pitem） */
function placeItemRow(it) {
  const n = it.node;
  const t = typeOf(n.type);
  const row = document.createElement('div');
  row.className = 'pitem';
  row.dataset.id = n.id;
  row.title = '在树状视图里定位这条信息';
  const dot = document.createElement('span');
  dot.className = 'pdot';
  dot.style.background = t.fg;
  const nm = document.createElement('span');
  nm.className = 'pname';
  nm.textContent = nodeLabel(n);
  row.append(dot, nm);
  if (n.type !== 'none') {
    const tp = document.createElement('span');
    tp.className = 'ptype';
    tp.textContent = t.name;
    row.appendChild(tp);
  }
  const exc = document.createElement('span');
  exc.className = 'pexc';
  exc.textContent = placeExcerpt(n);
  row.appendChild(exc);
  const go = document.createElement('span');
  go.className = 'go';
  go.textContent = '定位';
  row.appendChild(go);
  row.onclick = () => openNodeInTree(n.id);
  return row;
}

/* 判定分支的小树：每行一条肘形连接线，支持多层嵌套 */
function placeBranch(items) {
  const br = document.createElement('div');
  br.className = 'pbranch';
  for (const it of items) {
    const line = document.createElement('div');
    line.className = 'pbr';
    line.appendChild(placeItemRow(it));
    /* 分支里再挂判定（多层结果）：继续按小树缩进 */
    if (it.children.length) line.appendChild(placeBranch(it.children));
    br.appendChild(line);
  }
  return br;
}

function renderPlaceItems(box, items) {
  for (const it of items) {
    box.appendChild(placeItemRow(it));
    if (!it.children.length) continue;
    if (it.node.type === 'check') {
      /* 判定结果 = 判定块的「分支」，画成小树而不是平铺缩进 */
      box.appendChild(placeBranch(it.children));
    } else {
      const sub = document.createElement('div');
      sub.className = 'pitems sub';
      renderPlaceItems(sub, it.children);
      box.appendChild(sub);
    }
  }
}

function renderPlaceCard(host, idx, g, opt) {
  const filterAct = opt && opt.act ? opt.act : null;
  const card = document.createElement('div');
  card.className = 'pcard' + (g.parentKey ? ' sub' : '');
  card.dataset.key = g.key;

  const head = document.createElement('div');
  head.className = 'pc-head';
  const chev = document.createElement('button');
  chev.className = 'pc-chev';
  chev.textContent = S.placeCollapsed.has(g.key) ? '▸' : '▾';
  chev.title = '收起 / 展开';
  if (S.placeCollapsed.has(g.key)) card.classList.add('collapsed');
  chev.onclick = ev => {
    ev.stopPropagation();
    card.classList.toggle('collapsed');
    const collapsed = card.classList.contains('collapsed');
    if (collapsed) S.placeCollapsed.add(g.key); else S.placeCollapsed.delete(g.key);
    chev.textContent = collapsed ? '▸' : '▾';
  };
  const ttl = document.createElement('span');
  ttl.className = 'pc-title';
  ttl.textContent = g.title;
  ttl.title = g.title;
  const tag = document.createElement('span');
  tag.className = 'pc-tag';
  tag.textContent = '地点';
  const secs = [...g.sections.values()].sort((a, b) => a.order - b.order);
  const meta = document.createElement('span');
  meta.className = 'pc-meta';
  if (filterAct) {
    meta.textContent = '只看 ' + filterAct.title + ' · ' + g.itemCount + ' 条信息';
    meta.title = '当前只看：' + filterAct.title;
  } else {
    meta.textContent = secs.length + ' 幕 · ' + g.itemCount + ' 条信息';
    meta.title = '出现于：' + secs.map(s => s.title).join(' / ');
  }
  head.append(chev, ttl, tag, meta);
  card.appendChild(head);

  /* 上级地点路径 */
  const chain = [];
  const guard = new Set();
  let p = g.parentKey ? idx.groups.get(g.parentKey) : null;
  while (p && !guard.has(p.key)) {
    guard.add(p.key);
    chain.unshift(p.title);
    p = p.parentKey ? idx.groups.get(p.parentKey) : null;
  }
  if (chain.length) {
    const el = document.createElement('div');
    el.className = 'pc-path';
    el.textContent = '上级地点：' + chain.join(' › ');
    card.appendChild(el);
  }
  /* 各幕里上级地点不一致时说明归并规则 */
  if (g.parentCounts.size > 1) {
    const others = [...g.parentCounts.keys()]
      .filter(k => k !== g.parentKey && idx.groups.has(k))
      .map(k => idx.groups.get(k).title);
    const el = document.createElement('div');
    el.className = 'pc-note';
    el.textContent = '各幕里它的上级地点不一致：已归到「' + (g.parentTitle || '顶层') + '」'
      + (others.length ? '，另有 ' + others.join('、') : '') + '。';
    card.appendChild(el);
  }
  /* 地点自身的描述（跨幕去重） */
  for (const d of g.descs.values()) {
    const box = document.createElement('div');
    box.className = 'pc-desc';
    const dl = document.createElement('div');
    dl.className = 'dl';
    dl.textContent = '地点描述 · ' + d.acts.map(a => a.title).join(' / ');
    const md = document.createElement('div');
    md.innerHTML = mdToHtml(d.text);
    box.append(dl, md);
    card.appendChild(box);
  }
  /* 按幕列出下游枝干 */
  for (const sec of secs) {
    const wrap = document.createElement('div');
    wrap.className = 'pact';
    const h = document.createElement('div');
    h.className = 'pact-head';
    const name = document.createElement('span');
    name.textContent = sec.title;
    const cnt = document.createElement('span');
    cnt.className = 'n';
    cnt.textContent = countPlaceItems(sec.roots) + ' 条';
    h.append(name, cnt);
    if (sec.id) {
      h.classList.add('click');
      h.title = '在树状视图里定位这一幕';
      h.onclick = () => openNodeInTree(sec.id);
    }
    wrap.appendChild(h);
    const list = document.createElement('div');
    list.className = 'pitems';
    if (sec.roots.length) {
      renderPlaceItems(list, sec.roots);
    } else {
      const e = document.createElement('div');
      e.className = 'pitem empty';
      e.textContent = '（这一幕下还没有枝干）';
      list.appendChild(e);
    }
    wrap.appendChild(list);
    card.appendChild(wrap);
  }
  /* 子地点 */
  if (g.children.length) {
    const kids = document.createElement('div');
    kids.className = 'pkids';
    const lab = document.createElement('div');
    lab.className = 'pkids-label';
    lab.textContent = '子地点 · ' + g.children.length;
    kids.appendChild(lab);
    for (const c of g.children) renderPlaceCard(kids, idx, c, opt);
    card.appendChild(kids);
  }
  host.appendChild(card);
  return card;
}

function renderPlaceView() {
  const host = $('#placeView');
  if (!host) return;
  const keep = host.scrollTop || 0;
  const base = buildPlaceIndex(S.doc);
  const acts = placeActList(base);
  /* 幕被删掉 / 换了剧本后，按幕筛选自动回到「全部」 */
  if (S.placeAct !== 'all' && !acts.some(a => a.key === S.placeAct)) S.placeAct = 'all';
  const curAct = S.placeAct === 'all' ? null : (acts.find(a => a.key === S.placeAct) || null);
  const idx = placeIndexForAct(base, S.placeAct);
  host.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'pv-head';
  const title = document.createElement('div');
  title.className = 'pv-title';
  title.textContent = '地点模式';
  const sub = document.createElement('span');
  sub.className = 'pv-sub';
  sub.textContent = curAct
    ? '只看 ' + curAct.title + '：' + idx.placeCount + ' 个地点 · ' + idx.infoCount + ' 条信息'
    : base.placeCount + ' 个地点 · ' + base.infoCount + ' 条下游信息'
      + (base.mergedCount ? ' · ' + base.mergedCount + ' 个地点跨幕合并' : '');
  title.appendChild(sub);
  head.appendChild(title);
  /* 按幕筛选：全部 / 每一幕（只从地点索引里取幕，旧幕不会出现） */
  if (acts.length) {
    const chips = document.createElement('div');
    chips.className = 'pv-chips';
    const mkChip = (key, label, tip) => {
      const b = document.createElement('button');
      b.className = 'pv-chip' + (S.placeAct === key ? ' on' : '');
      b.dataset.act = key;
      b.textContent = label;
      if (tip) b.title = tip;
      b.onclick = () => {
        if (S.placeAct === key) return;
        S.placeAct = key;
        renderPlaceView();
      };
      chips.appendChild(b);
    };
    mkChip('all', '全部', '显示所有幕');
    for (const a of acts) mkChip(a.key, a.title, '只看：' + a.title);
    head.appendChild(chips);
  }
  const tools = document.createElement('div');
  tools.className = 'pv-tools';
  const fold = document.createElement('button');
  fold.className = 'btn ghost';
  const allCollapsed = idx.groups.size > 0 && [...idx.groups.keys()].every(k => S.placeCollapsed.has(k));
  fold.textContent = allCollapsed ? '全部展开' : '全部收起';
  fold.dataset.s = allCollapsed ? 'c' : 'o';
  fold.onclick = () => {
    const collapse = fold.dataset.s !== 'c';
    fold.dataset.s = collapse ? 'c' : 'o';
    fold.textContent = collapse ? '全部展开' : '全部收起';
    $$('.pcard', host).forEach(c => {
      c.classList.toggle('collapsed', collapse);
      if (collapse) S.placeCollapsed.add(c.dataset.key); else S.placeCollapsed.delete(c.dataset.key);
    });
    $$('.pc-chev', host).forEach(c => { c.textContent = collapse ? '▸' : '▾'; });
  };
  tools.appendChild(fold);
  head.appendChild(tools);
  host.appendChild(head);
  if (!base.placeCount) {
    renderPlaceEmpty(host);
    return;
  }
  const list = document.createElement('div');
  list.className = 'pv-list';
  if (!idx.placeCount) {
    const e = document.createElement('div');
    e.className = 'pv-filter-empty';
    e.textContent = '这一幕下还没有地点信息';
    list.appendChild(e);
  } else {
    for (const g of idx.topGroups) renderPlaceCard(list, idx, g, { act: curAct });
  }
  host.appendChild(list);
  hydrateImages(host);
  host.scrollTop = keep;
}

function openNodeInTree(id) {
  if (!nodeOf(id)) return;
  if (S.viewMode === 'place') setViewMode('tree', true);
  for (const a of ancestorsOf(id)) a.collapsed = false;
  S.focusId = null;
  selectNode(id, true);
  flash(id);
}

function setViewMode(mode, force) {
  mode = (mode === 'place' || mode === 'trunk') ? mode : 'tree';
  if (S.viewMode === mode && !force) return;
  S.viewMode = mode;
  $$('#modeSwitch button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  document.body.classList.toggle('mode-place', mode === 'place');
  document.body.classList.toggle('mode-trunk', mode === 'trunk');
  const pv = $('#placeView');
  if (pv) pv.hidden = mode !== 'place';
  if (mode === 'place') {
    S.focusId = null;
    S.edit = null;
    renderPlaceView();
    $('#modeBadge').hidden = false;
    $('#modeBadge').textContent = '地点';
  } else if (mode === 'trunk') {
    S.focusId = null;
    renderTrunkView();
  } else {
    renderTree();
    applyView();
    setTimeout(updateMinimap, 30);
  }
  try {
    if (mode === 'place') {
      if (location.hash !== '#place') location.hash = '#place';
    } else if (location.hash === '#place') {
      location.hash = '';
    }
  } catch (e) { /* file:// 下个别浏览器不允许改 hash，忽略 */ }
  scheduleSaveViewState();   /* 记住上次用的视图模式 */
}

const isTyping = el => el && (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT' || el.isContentEditable);

document.addEventListener('keydown', ev => {
  const k = ev.key;
  const mod = ev.ctrlKey || ev.metaKey;

  if (mod && (k === 'k' || k === 'K')) { ev.preventDefault(); openSearch(); return; }
  if (mod && (k === 'j' || k === 'J')) { ev.preventDefault(); toggleDrawer(); return; }
  if (mod && !ev.altKey && (k === 's' || k === 'S')) { ev.preventDefault(); exportMarkdown(); return; }
  if (mod && ev.altKey && (k === 's' || k === 'S')) { ev.preventDefault(); exportMarkdown(); return; }
  if (k === 'Escape') {
    if (!$('#modal').hidden) { closeModal(); return; }
    if (!$('#pop').hidden || !$('#menu').hidden) { closePop(); closeMenu(); return; }
    if (S.focusId) { exitFocus(); return; }
    if (S.edit) { S.edit = null; renderTree(); return; }
    if (!$('#drawer').hidden) { toggleDrawer(false); return; }
    if (S.viewMode === 'place') { setViewMode('tree'); return; }
    if (S.viewMode === 'trunk') {
      const cur = S.sel ? nodeOf(S.sel) : null;
      if (cur && cur.parentId && nodeOf(cur.parentId)) { selectNode(cur.parentId, false); return; }
    }
    return;
  }
  if (isTyping(ev.target)) return;
  if (S.viewMode === 'place' && k !== '?') return;

  if (mod && (k === 'z' || k === 'Z')) {
    ev.preventDefault();
    if (ev.shiftKey) { if (!Undo.redo()) toast('没有可重做的了'); }
    else if (!Undo.undo()) toast('没有可撤销的了');
    return;
  }
  if (mod && (k === 'y' || k === 'Y')) { ev.preventDefault(); Undo.redo(); return; }
  if (mod && (k === 'ArrowUp' || k === 'ArrowDown') && S.sel) {
    ev.preventDefault(); moveInSiblings(S.sel, k === 'ArrowUp' ? -1 : 1); return;
  }
  if (!$('#modal').hidden || !$('#drawer').hidden && isTyping(document.activeElement)) return;

  switch (k) {
    case 'Tab': {
      ev.preventDefault();
      if (S.sel) {
        if (judgeFlowByTab(S.sel)) return;
        addChild(S.sel);
      }
      else if (S.doc.rootIds[0]) selectNode(S.doc.rootIds[0], true);
      else {
        const n0 = addNode(null);
        S.sel = n0.id; renderTree(); startEdit(n0.id, 'title');
      }
      return;
    }
    case 'Enter':
      ev.preventDefault();
      if (S.sel) addSibling(S.sel);   /* 回车 = 建同级分支，并自动进入标题编辑 */
      return;
    case 'ArrowUp': case 'k': ev.preventDefault(); moveSel(-1); return;
    case 'ArrowDown': case 'j': ev.preventDefault(); moveSel(1); return;
    case 'ArrowLeft': {
      if (!S.sel) return;
      ev.preventDefault();
      const n = nodeOf(S.sel);
      if (n.children.length && !n.collapsed) { n.collapsed = true; renderTree(); }
      else if (n.parentId) selectNode(n.parentId, true);
      return;
    }
    case 'ArrowRight': {
      if (!S.sel) return;
      ev.preventDefault();
      const n = nodeOf(S.sel);
      if (n.children.length && n.collapsed) { n.collapsed = false; renderTree(); }
      else if (n.children.length) selectNode(n.children[0], true);
      return;
    }
    case 'Backspace': case 'Delete':
      if (S.sel) { ev.preventDefault(); delNode(S.sel); }
      return;
    case 'F2': {
      if (!S.sel) return;
      ev.preventDefault();
      startEdit(S.sel, ev.shiftKey ? 'content' : 'title');  /* F2 改标题，Shift+F2 改正文 */
      return;
    }
    case 'e': case 'E':
      if (!S.sel || ev.ctrlKey || ev.metaKey) return;
      ev.preventDefault();
      startEdit(S.sel, ev.shiftKey ? 'content' : 'title');  /* e 改标题，Shift+E 改正文 */
      return;
    case 'f': case 'F': fitView(); return;
    case 'Home':
      /* 主干视图：Home 回到文档开头（第一根主干居中），连各列滚动位置一起重置 */
      if (S.viewMode === 'trunk') {
        ev.preventDefault();
        if (S.doc && S.doc.rootIds.length) selectNode(S.doc.rootIds[0], true);
        return;
      }
      resetView();
      return;
    case 'End':
      /* 主干视图：End 跳到最后一根主干 */
      if (S.viewMode === 'trunk') {
        ev.preventDefault();
        const roots = S.doc ? S.doc.rootIds : [];
        if (roots.length) selectNode(roots[roots.length - 1], true);
        return;
      }
      return;
    case '?': openHelp(); return;
    case 'n': if (ev.shiftKey && S.sel) addSibling(S.sel); return;
  }
});

/* =========================================================
