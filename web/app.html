<!doctype html>
<html lang="zh-CN" data-font="serif">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>枝条笔记</title>
<style>
/* ============ 基础 ============ */
:root{
  --bg:#FAF8F5;
  --bg-2:#F3EFE9;
  --panel:#FFFFFF;
  --ink:#2E2A28;
  --ink-2:#6B635C;
  --ink-3:#8E847B;
  --line:#E7E1D9;
  --line-2:#EFEAE3;
  --accent:#8C7A6B;
  --focus:#FFF7EA;
  --shadow:0 1px 2px rgba(70,55,40,.05),0 4px 14px rgba(70,55,40,.045);
  --shadow-lift:0 2px 6px rgba(70,55,40,.08),0 12px 30px rgba(70,55,40,.10);
  --r:10px;
  --card-w:430px;
  --indent:38px;
  --topbar-h:50px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);overflow:hidden;
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
.hidden,[hidden]{display:none !important}
.grow{flex:1 1 auto}
.link{color:var(--ink-2);text-decoration:none;border-bottom:1px dashed var(--line);cursor:pointer}
.link:hover{color:var(--ink);border-bottom-color:var(--ink-3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#DCD5CC;border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#C9C0B5;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============ 顶栏 ============ */
#app{display:flex;flex-direction:column;height:100vh}
#topbar{
  height:var(--topbar-h);flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:0 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.72);
  backdrop-filter:blur(8px);z-index:60;
}
.tb-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto}
.tb-right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.nb{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;font-weight:600;font-size:13.5px;max-width:260px}
.nb:hover{background:var(--bg-2)}
.nb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb i{font-style:normal;color:var(--ink-3);font-size:10px}
.crumbs{display:flex;align-items:center;gap:2px;min-width:0;overflow:hidden;font-size:12.5px;color:var(--ink-3)}
.crumbs a{color:var(--ink-3);text-decoration:none;padding:2px 4px;border-radius:5px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.crumbs a:hover{color:var(--ink);background:var(--bg-2)}
.crumbs i{font-style:normal;opacity:.5;font-size:10px}
.btn{
  padding:5px 11px;border-radius:8px;font-size:13px;color:var(--ink-2);
  border:1px solid transparent;transition:background .12s,color .12s;
}
.btn:hover{background:var(--bg-2);color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:#46403B}
.btn.ghost{border-color:var(--line)}
.btn.icon{width:28px;height:28px;display:grid;place-items:center;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.badge{
  font-size:11.5px;padding:2px 8px;border-radius:20px;background:#EFE7DA;color:#7A6A55;
  border:1px solid #E3D8C6;letter-spacing:.02em;
}

/* ============ 画布 ============ */
#viewport{position:relative;flex:1 1 auto;overflow:hidden;background:
  radial-gradient(circle at 18% 12%,rgba(255,255,255,.9),transparent 45%),
  radial-gradient(circle at 82% 88%,rgba(243,236,226,.75),transparent 50%),
  var(--bg);
  cursor:default;
}
#viewport.grabbing{cursor:grabbing}
body.drawer-open #viewport{margin-right:400px}
body.drawer-open #minimap{right:auto;left:16px;bottom:56px}
#stage{
  position:absolute;left:0;top:0;transform-origin:0 0;padding:44px 90px 220px 70px;
  will-change:transform;
}
.trunk{display:flex;flex-direction:column;gap:14px;min-width:var(--card-w);position:relative}
/* 主干：左侧竖脊，串起所有根枝，向外分叉 */
.trunk::before{
  content:"";position:absolute;left:-17px;top:26px;bottom:26px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,rgba(190,137,120,.42) 0%,rgba(190,137,120,.16) 100%);
}

/* 专注写作时收起主干装饰，避免孤零零一条线 */
#viewport.focusmode .trunk::before,
#viewport.focusmode .trunk>.node::before{content:none}

/* --- 节点：横向生长（主干在左，子枝一律向右展开） --- */
.node{position:relative;display:flex;align-items:center;transition:opacity .18s ease,filter .18s ease}
.node>.children{
  display:flex;flex-direction:column;gap:8px;position:relative;
  margin-left:58px;padding-left:24px;
}
.node.collapsed>.children{display:none}
/* 根枝与主干脊线的短连接 */
.trunk>.node::before{
  content:"";position:absolute;left:-17px;top:50%;width:17px;height:1px;background:var(--line-2);
}
/* 父卡片 → 子枝脊线 的水平连接 */
.node>.children::before{
  content:"";position:absolute;left:-58px;top:50%;width:58px;height:1px;
  background:linear-gradient(90deg,var(--line) 0%,rgba(231,225,217,.5) 100%);
}
/* 子枝之间的竖向脊线（由每个子节点自己往前接一段） */
.node>.children>.node::before{
  content:"";position:absolute;left:-24px;top:50%;width:24px;height:1px;background:var(--line-2);
}
.node>.children>.node::after{
  content:"";position:absolute;left:-24px;top:-8px;bottom:50%;width:1px;background:var(--line-2);
}
.node>.children>.node:first-child::after{content:none}

/* =========================================================
   主干视图：连续分组列
   - 一层一列，各列独立上下滚动
   - 每列按父节点分组：上一列所有父节点的子枝依次排列（所以往上滑能看到上一根主干的分支）
   - 选中项在自己的列里垂直居中；它的分支从与它平齐的位置往下排
   ========================================================= */
#split{display:none;position:absolute;inset:0}
body.mode-trunk #split{display:block}
body.mode-trunk #stage,
body.mode-trunk #minimap,
body.mode-trunk #zoomPill{display:none}
#cols{
  position:absolute;inset:0;z-index:1;display:flex;align-items:stretch;gap:14px;
  overflow-x:auto;overflow-y:hidden;padding:0 28px 0 22px;
  cursor:grab;scrollbar-width:thin;
}
#cols.panning{cursor:grabbing}
#cols.armed *{user-select:none !important}
#cols.panning .col{pointer-events:none}
#cols.panning *{user-select:none !important}
.col{
  flex:0 0 var(--bn-colw,306px);width:var(--bn-colw,306px);min-height:0;box-sizing:border-box;
  display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;
  padding:0 4px;overscroll-behavior:contain;
}
.col-hd{
  position:sticky;top:0;z-index:3;display:flex;align-items:baseline;gap:7px;
  padding:10px 2px 8px;background:var(--bg);
  font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);
  text-transform:uppercase;user-select:none;
}
.col-hd .ch-count{letter-spacing:0;text-transform:none;color:#A79C92;font-size:10.5px}
.col-pad{flex:0 0 auto}
.grp{margin:0 0 18px}
.grp:last-child{margin-bottom:0}
.grp-hd{
  display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
  padding:2px 4px 7px;margin:0 0 2px;border-radius:6px;
  font:inherit;font-size:10.5px;letter-spacing:.06em;color:#A79C92;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.grp-hd:hover{background:var(--bg-2);color:var(--ink-3)}
.grp.on>.grp-hd{color:#8C7A6B}
#cols .node.path>.card{box-shadow:0 0 0 1px rgba(190,137,120,.4),0 1px 2px rgba(80,60,50,.05)}
#cols .node.path.sel>.card{box-shadow:0 0 0 2px rgba(190,137,120,.55),0 8px 24px rgba(80,60,50,.12)}
#viewport.focusmode #cols .node.sel>.card{width:100%;max-width:100%;transform:none}
#viewport.focusmode #cols .node.sel .body{max-height:none}
.grp-empty{padding:2px 6px 6px;font-size:11.5px;color:#A79C92}
#cols .node{display:block;margin:0 0 9px}
#cols .card{width:100%;max-width:none;padding:11px 34px 12px 15px}
#cols .card-main{padding-right:0;width:100%;min-width:0}
/* 正文完全展开：卡片内容不截断，跟树状视图里看到的一样 */
#cols .card .body{
  max-height:none;overflow:visible;-webkit-mask-image:none;mask-image:none;
  overflow-wrap:anywhere;word-break:break-word;
}
#cols .card .t{overflow-wrap:anywhere}
/* 主干视图：卡片宽度 / 字号 / 缩放（设置里可调，Ctrl+滚轮缩放）；正文颜色加深，保证小字号也看得清 */
#cols .card .body{font-size:var(--bn-fs,13.5px);color:#4A423B}
#cols .card .ttl{font-size:calc(var(--bn-fs,13.5px) + 1.2px)}
#cols textarea.ta.body-ta{font-size:var(--bn-fs,13.5px);color:#4A423B}
/* 编辑态：文本域不许溢出卡片 */
#cols textarea.ta,
#cols input.ti{
  width:100%;max-width:100%;box-sizing:border-box;display:block;
  overflow-wrap:anywhere;word-break:break-word;
}
#cols .card .toggle{display:none}

/* ====== 长按拖动：进入拖动模式后所有卡片收成「只显示标题」，拎起的子树高亮 ====== */
body.dragmode .card .body,
body.dragmode .card .summary-line,
body.dragmode .card .count,
body.dragmode .card .type-chip{display:none}
body.dragmode .card{padding-top:8px;padding-bottom:8px;cursor:grabbing}
body.dragmode .card-main{padding-right:24px}
body.dragmode *{user-select:none !important}
body.dragmode .node{opacity:.62}
body.dragmode .node.drag-src{opacity:1}
body.dragmode .node.drag-src>.card{
  box-shadow:0 0 0 2px rgba(190,137,120,.62),0 12px 30px rgba(80,60,50,.16);
}
body.dragmode .col-tail,body.dragmode .grp-empty{opacity:.35}
body.dragmode .card.drop-into{box-shadow:0 0 0 2px rgba(124,141,181,.85),0 8px 24px rgba(80,60,50,.14)}
body.dragmode .grp.drop-into{background:rgba(124,141,181,.10);outline:1px dashed rgba(124,141,181,.62);border-radius:12px}
.drag-ghost{
  position:fixed;z-index:9999;pointer-events:none;max-width:320px;
  padding:7px 11px;border-radius:10px;background:#2E2A28;color:#fff;
  font:inherit;font-size:12.5px;line-height:1.5;letter-spacing:.01em;
  box-shadow:0 14px 34px rgba(20,14,10,.34);opacity:.95;
}
.drag-ghost b{font-weight:650}
.drag-ghost span{color:#C9BEB2}
#cols .col-tail{
  margin:6px 0 0;padding:9px 8px;border:1px dashed var(--line-2);border-radius:9px;
  width:100%;box-sizing:border-box;background:transparent;color:var(--ink-3);font-size:12px;
  cursor:pointer;font-family:inherit;
}
#cols .col-tail:hover{border-color:var(--line);color:var(--ink);background:rgba(255,255,255,.6)}
#cols .empty{padding:26px 6px;color:var(--ink-3);font-size:12.5px;line-height:1.7}
/* 包络背景：把当前主干（或选中分支）的从属链罩起来，一眼看出谁挂谁下面。
   色带画在 #cols 之上的一层里（按屏幕坐标重算），相邻列的色带互相重叠 → 连成一整片。 */
.col{position:relative}
#envLayer{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#envLayer .env-band{
  position:absolute;border-radius:15px;
  background:var(--env-bg,rgba(190,137,120,.10));
  transition:background-color .25s ease;
}
.card{
  position:relative;width:var(--card-w);background:var(--panel);border-radius:var(--r);
  padding:11px 15px 12px 18px;box-shadow:var(--shadow);border:1px solid rgba(70,55,40,.055);
  transition:box-shadow .16s,border-color .16s,transform .16s;cursor:text;
  --c:#ECEAE5;--a:#9B958A;
}
.card::before{
  content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;
  background:var(--a);opacity:.85;
}
.card:hover{box-shadow:var(--shadow-lift)}
.node.sel>.card{
  box-shadow:0 0 0 2px rgba(140,122,107,.28),var(--shadow-lift);
  border-color:rgba(140,122,107,.18);
}
.card-main{padding-right:64px}

.ttl{
  font-weight:650;font-size:14.5px;line-height:1.5;color:var(--ink);
  outline:none;word-break:break-word;min-height:1.4em;
}
.ttl:empty::before{content:attr(data-ph);color:var(--ink-3);font-weight:500}
.body{
  margin-top:3px;color:#4B433C;font-size:13.5px;line-height:1.72;
  word-break:break-word;overflow:hidden;min-height:1.2em;
}
html[data-font="serif"] .body{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:14px}
.body p{margin:0 0 .35em}
.body p:last-child{margin-bottom:0}
.body h1,.body h2,.body h3{margin:.4em 0 .25em;font-size:1.05em;color:var(--ink)}
.body ul,.body ol{margin:.2em 0;padding-left:1.3em}
.body li{margin:.1em 0}
.body blockquote{margin:.3em 0;padding:.1em .8em;border-left:2px solid var(--line);color:var(--ink-3)}
.body code{background:var(--bg-2);padding:.1em .35em;border-radius:4px;font-size:.9em;
  font-family:"Cascadia Mono",Consolas,monospace}
.body pre{background:var(--bg-2);padding:.5em .7em;border-radius:6px;overflow:auto;margin:.3em 0}
.body pre code{background:none;padding:0}
.body table{border-collapse:collapse;margin:.3em 0;font-size:.95em}
.body th,.body td{border:1px solid var(--line);padding:.2em .5em}
.body a{color:#7C8DB5}
.body img{max-width:100%;border-radius:6px;margin:.2em 0;display:block}
.body hr{border:0;border-top:1px solid var(--line);margin:.6em 0}
.body .preview-clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.body .wikilink{color:#7C8DB5;border-bottom:1px dashed #C3CCE0;cursor:pointer}
.type-btn{
  position:absolute;right:10px;top:9px;font-size:11.5px;padding:2px 9px;border-radius:20px;
  background:var(--c);color:var(--a);border:1px solid rgba(0,0,0,.04);font-weight:600;letter-spacing:.02em;
}
.type-btn:hover{filter:brightness(.97)}
.count{
  position:absolute;left:15px;bottom:7px;font-size:11px;color:var(--ink-3);opacity:0;
  transition:opacity .15s;pointer-events:none;
}
.card:hover .count{opacity:1}
.summary-line{
  margin-top:6px;font-size:12px;color:var(--ink-3);display:none;gap:6px;align-items:baseline;
  border-top:1px dashed var(--line-2);padding-top:5px;
}
.node:hover>.card .summary-line,
.node.sel>.card .summary-line,
.node.collapsed>.card .summary-line{display:flex}
.addbtn{
  position:absolute;right:9px;bottom:6px;font-size:11.5px;color:#9B928A;padding:2px 8px;
  border-radius:20px;background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.05);
  opacity:0;transition:opacity .14s,color .14s;pointer-events:none;
}
.card:hover .addbtn{opacity:1;pointer-events:auto}
.addbtn:hover{color:var(--ink);background:#fff}
.summary-line .dot{width:5px;height:5px;border-radius:50%;background:#E0B25C;flex:0 0 auto;transform:translateY(-2px)}
.summary-line .dot.lock{background:#B9B2A9}
.summary-line .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary-line .txt.act{cursor:pointer}
.summary-line .txt.act:hover{color:var(--ink-2)}
.toggle{
  position:absolute;right:-25px;left:auto;top:calc(50% - 8.5px);width:17px;height:17px;border-radius:50%;
  background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;
  font-size:9px;color:var(--ink-3);opacity:0;transition:opacity .15s;z-index:3;
}
.node:hover>.card>.toggle,.node.sel>.card>.toggle{opacity:1}
.toggle:hover{background:var(--bg-2);color:var(--ink)}
.toggle.empty{opacity:0 !important;pointer-events:none}

/* 亮度三档：只压暗、不作模糊；鼠标移上去的枝干会立刻恢复清晰，方便对照 */
.node{transition:opacity .16s ease}
.node.dim1{opacity:.78}
.node.dim2{opacity:.58}
.node.dim1:hover,.node.dim2:hover{opacity:1}
#viewport.focusmode .node{opacity:.38}
#viewport.focusmode .node.rel{opacity:.62}
#viewport.focusmode .node:hover{opacity:1}
#viewport.focusmode .node.sel{opacity:1}
#viewport.focusmode .node.sel .card{transform:scale(1);width:760px}

/* 编辑态 */
.ta{
  display:block;width:100%;border:0;outline:none;resize:none;background:transparent;
  padding:0;margin:0;overflow:hidden;color:var(--ink);
  font:inherit;line-height:1.72;
}
.ta.ttl-ta{font-weight:650;font-size:14.5px;line-height:1.5}
html[data-font="serif"] .ta.body-ta{font-family:Georgia,"Songti SC","STSong","SimSun",serif;font-size:14px;color:var(--ink-2)}
.ta::placeholder{color:var(--ink-3)}
.flash{animation:flash 1.2s ease}
@keyframes flash{0%,100%{box-shadow:var(--shadow)}30%{box-shadow:0 0 0 4px rgba(224,178,92,.45),var(--shadow-lift)}}

/* 拖放图片 */
#viewport.dragover::after{
  content:"松手插入图片";position:absolute;inset:16px;border:2px dashed rgba(140,122,107,.35);
  border-radius:16px;display:grid;place-items:center;font-size:15px;color:#8C7A6B;background:rgba(255,255,255,.55);z-index:5;
}

/* ============ 迷你地图 / 缩放 ============ */
#minimap canvas{width:100%;height:100%;display:block}
#minimap{
  position:absolute;right:16px;bottom:16px;width:200px;height:100px;border-radius:10px;
  background:rgba(255,255,255,.82);border:1px solid var(--line);box-shadow:var(--shadow);
  padding:4px;cursor:pointer;z-index:20;backdrop-filter:blur(6px);
}
#zoomPill{
  position:absolute;left:16px;bottom:16px;font-size:11.5px;color:var(--ink-3);
  background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:20px;
  padding:3px 10px;z-index:20;user-select:none;cursor:pointer;
}
#zoomPill:hover{color:var(--ink)}

/* ============ AI 抽屉 ============ */
#drawer{
  position:fixed;right:0;top:var(--topbar-h);bottom:0;width:400px;z-index:70;
  background:rgba(255,255,255,.97);border-left:1px solid var(--line);
  box-shadow:-8px 0 30px rgba(70,55,40,.07);display:flex;flex-direction:column;
  animation:slidein .18s ease;
}
@keyframes slidein{from{transform:translateX(14px);opacity:.4}to{transform:none;opacity:1}}
.dr-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line-2)}
.dr-head strong{font-size:13.5px}
.dr-head select{border:1px solid var(--line);border-radius:7px;padding:2px 6px;font-size:12px;background:#fff}
.ctx{padding:8px 12px;border-bottom:1px solid var(--line-2);background:#FCFAF7;font-size:12px;color:var(--ink-2)}
.ctx-line{display:flex;align-items:center;gap:8px}
.ctx-detail{max-height:160px;overflow:auto;margin-top:6px;border-top:1px dashed var(--line-2);padding-top:6px}
.costbar{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line-2);background:#FBF8F3;font-size:11.5px;color:var(--ink-3)}
.costbar b{color:#8C7A6B;font-weight:600}
.msg .meta{margin-top:4px;font-size:10.5px;color:#A79C92;line-height:1.5}
#costTable{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
#costTable th,#costTable td{padding:4px 6px;border-bottom:1px solid var(--line-2);text-align:left;white-space:nowrap}
#costTable th{color:var(--ink-3);font-weight:500}
#costTable td.num{text-align:right;font-variant-numeric:tabular-nums}
#costTable tr.sum td{font-weight:600;border-top:1px solid var(--line);border-bottom:none}

.ctx-item{display:flex;gap:6px;align-items:flex-start;padding:2px 0;line-height:1.4}
.ctx-item input{margin-top:3px}
.ctx-item .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs{flex:1 1 auto;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:100%;font-size:13px;line-height:1.7}
.msg .who{font-size:11px;color:var(--ink-3);margin-bottom:3px;letter-spacing:.04em}
.msg.user .bubble{background:var(--bg-2);padding:8px 11px;border-radius:10px}

<script>
'use strict';
/* =========================================================
   0. 小工具
   ========================================================= */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const norm = s => String(s ?? '').replace(/\s+/g, ' ').trim();

let toastTimer = null;
function toast(msg, ms = 1900) {
  const el = $('#toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms);
}
function debounce(fn, ms) {
  let t = null;
  const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  d.flush = (...a) => { clearTimeout(t); fn(...a); };
  return d;
}
function bytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
  return (n / 1024 / 1024).toFixed(1) + ' MB';
}
/* 中文粗估：1 汉字 ≈ 0.65 token */
function estTokens(text) {
  let cjk = 0, other = 0;
  for (const ch of String(text || '')) {
    if (/[\u3400-\u9FFF\uF900-\uFAFF\u3000-\u303F\uFF00-\uFFEF]/.test(ch)) cjk++;
    else other++;
  }
  return Math.ceil(cjk * 0.7 + other * 0.28);
}

/* =========================================================
   1. 类型与配色
   ========================================================= */
const DEFAULT_TYPES = [
  { id: 'plot',   name: '剧情', bg: '#F4DFD7', fg: '#BE8978' },
  { id: 'npc',    name: '人物', bg: '#DFE7F4', fg: '#7C8DB5' },
  { id: 'place',  name: '地点', bg: '#E1EBDE', fg: '#7E9E80' },
  { id: 'clue',   name: '线索', bg: '#D8E8EC', fg: '#7A9BA8' },
  { id: 'check',  name: '判定', bg: '#E8E2F2', fg: '#9385B2' },
  { id: 'mythos', name: '神话', bg: '#EBD9E2', fg: '#B98A9C' },
  { id: 'item',   name: '道具', bg: '#E7E3DA', fg: '#9B958A' },
  { id: 'none',   name: '未分类', bg: '#ECEAE5', fg: '#9B958A' },
];
const TYPE_MAP = () => {
  const m = {};
  for (const t of DEFAULT_TYPES) m[t.id] = t;
  for (const t of (S.doc?.settings?.types || [])) m[t.id] = t;
  return m;
};
const typeOf = id => TYPE_MAP()[id] || DEFAULT_TYPES[7];

/* 十六进制 → hsl / 派生柔和色 */
function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
}
function rgbToHsl([r, g, b]) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) {
    const d = mx - mn;
    s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0));
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return [h, s * 100, l * 100];
}
function hslToHex(h, s, l) {
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const to = x => Math.round(255 * x).toString(16).padStart(2, '0');
  return '#' + to(f(0)) + to(f(8)) + to(f(4));
}
/* 从一个"主色"派生柔和底色 + 深强调色 */
function deriveSoft(hex) {
  const [h, s] = rgbToHsl(hexToRgb(hex));
  return {
    bg: hslToHex(h, clamp(s * .55, 18, 42), 91),
    fg: hslToHex(h, clamp(s * .55, 22, 45), 48),
  };
}

/* =========================================================
   2. 本地存储（IndexedDB，失败降级 localStorage）
   ========================================================= */
const Store = (() => {
  let db = null, ready = null, broken = false;
  function open() {
    return new Promise((res, rej) => {
      let req;
      try { req = indexedDB.open('coc-notes', 1); } catch (e) { return rej(e); }
      req.onupgradeneeded = e => {
        const d = e.target.result;
        for (const s of ['docs', 'assets', 'meta', 'snaps']) {
          if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
        }
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }
  async function init() {
    if (ready) return ready;
    ready = open().then(d => { db = d; }).catch(err => {
      broken = true;
      console.warn('[store] IndexedDB 不可用，降级 localStorage：', err);
    });
    return ready;
  }
  const lsKey = (s, k) => 'cocfb:' + s + ':' + k;
  async function tx(store, mode, fn) {
    await init();
    if (broken) throw new Error('idb-unavailable');
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const os = t.objectStore(store);
      let out;
      const r = fn(os);
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  }
  return {
    async get(store, id) {
      try {
        const v = await tx(store, 'readonly', os => os.get(id));
        if (v !== undefined) return v;
      } catch (e) { /* 降级 */ }
      const raw = localStorage.getItem(lsKey(store, id));
      return raw ? JSON.parse(raw) : undefined;
    },
    async put(store, val) {
      try { return await tx(store, 'readwrite', os => os.put(val)); }
      catch (e) { localStorage.setItem(lsKey(store, val.id), JSON.stringify(val)); }
    },
    async del(store, id) {
      try { return await tx(store, 'readwrite', os => os.delete(id)); }
      catch (e) { localStorage.removeItem(lsKey(store, id)); }
    },
    async all(store) {
      try {
        const r = await tx(store, 'readonly', os => os.getAll());
        if (Array.isArray(r)) return r;
      } catch (e) { /* 降级 */ }
      const out = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('cocfb:' + store + ':')) {
          try { out.push(JSON.parse(localStorage.getItem(k))); } catch (e2) {}
        }
      }
      return out;
    },
  };
})();

function trunkStyleRules() {

function makeNode(parentId) {
  return {
    id: uid(), parentId: parentId || null, children: [],
    title: '', content: '', type: 'none',
    summary: '', summaryLocked: false, hash: '', collapsed: false,
    ts: Date.now(),
  };
}
function newDoc(name) {
  return {
    id: uid(), name: name || '未命名剧本', createdAt: Date.now(), updatedAt: Date.now(),
    rootIds: [], nodes: {}, settings: { types: [] },
  };
}
function addNode(parentId, opts = {}) {
  const n = makeNode(parentId);
  Object.assign(n, opts);
  S.doc.nodes[n.id] = n;
  if (parentId) {
    const p = S.doc.nodes[parentId];
    p.children.push(n.id);
    p.collapsed = false;
  } else {
    S.doc.rootIds.push(n.id);
  }
  touch();
  return n;
}
function nodeOf(id) { return S.doc?.nodes?.[id] || null; }
function childrenOf(id) { return (nodeOf(id)?.children || []).map(nodeOf).filter(Boolean); }
function rootsOf() { return (S.doc?.rootIds || []).map(nodeOf).filter(Boolean); }
function siblingsOf(id) {
  const n = nodeOf(id);
  if (!n) return [];
  return n.parentId ? childrenOf(n.parentId) : rootsOf();
}
function indexInSiblings(id) { return siblingsOf(id).findIndex(n => n.id === id); }
function ancestorsOf(id) {
  const out = [];
  let n = nodeOf(id);
  while (n && n.parentId) { n = nodeOf(n.parentId); if (n) out.unshift(n); }
  return out;
}
function descendantsOf(id, out = []) {
  for (const c of childrenOf(id)) { out.push(c); descendantsOf(c.id, out); }
  return out;
}
function subtreeIds(id, out = []) {
  out.push(id);
  for (const c of childrenOf(id)) subtreeIds(c.id, out);
  return out;
}
function pathOf(id) {
  const n = nodeOf(id);
  if (!n) return [];
  return [...ancestorsOf(id), n];
}
function nodeLabel(n) {
  if (!n) return '';
  const t = norm(n.title);
  if (t) return t;
  const c = norm(n.summary || n.content.replace(/[#>*`\-\[\]!|]/g, ' '));
  return c.slice(0, 18) || '未命名';
}
function depthOf(id) {
  let d = 0, n = nodeOf(id);
  while (n && n.parentId) { n = nodeOf(n.parentId); d++; }
  return d;
}
function pruneDetached() {
  const seen = new Set();
  const walk = id => {
    const n = nodeOf(id);
    if (!n || seen.has(id)) return;
    seen.add(id);
    for (const c of [...n.children]) walk(c);
  };
  for (const id of S.doc.rootIds) walk(id);
  for (const id of Object.keys(S.doc.nodes)) if (!seen.has(id)) delete S.doc.nodes[id];
}
function touch() { if (S.doc) S.doc.updatedAt = Date.now(); }

/* =========================================================
   4. 撤销 / 重做
   ========================================================= */
const Undo = (() => {
  let stack = [], idx = -1, lastAt = 0, timer = null;
  const MAX = 40;
  function snap() { return JSON.stringify({ rootIds: S.doc.rootIds, nodes: S.doc.nodes }); }
  function reset() { stack = [snap()]; idx = 0; }
  function push(force) {
    if (!S.doc) return;
    const now = Date.now();
    clearTimeout(timer);
    const doPush = () => {
      const s = snap();
      if (stack[idx] === s) return;
      stack = stack.slice(0, idx + 1);
      stack.push(s);
      if (stack.length > MAX) stack.shift();
      idx = stack.length - 1;
      lastAt = Date.now();
    };
    if (force || now - lastAt > 420) doPush();
    else timer = setTimeout(doPush, 420);
  }
  function apply(s) {
    const o = JSON.parse(s);
    S.doc.rootIds = o.rootIds;
    S.doc.nodes = o.nodes;
    if (!nodeOf(S.sel)) S.sel = o.rootIds[0] || null;
    touch(); renderTree(); scheduleSave();
  }
  return {
    reset, push,
    undo() {
      if (idx <= 0) return false;
      idx--; apply(stack[idx]); return true;
    },
    redo() {
      if (idx >= stack.length - 1) return false;
      idx++; apply(stack[idx]); return true;
    },
    canUndo: () => idx > 0,
    canRedo: () => idx < stack.length - 1,
  };
})();

/* =========================================================
   6. Markdown 渲染（自研，够用即止）
   ========================================================= */
const IMG_CACHE = new Map();   // assetId -> objectURL
const IMG_PENDING = new Map();

function inlineMd(s) {
  let t = esc(s);
  const codes = [];
  t = t.replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, src) => `<img alt="${alt}" data-src="${src}">`);
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
    (m, txt, href) => `<a href="${href}" target="_blank" rel="noopener noreferrer">${txt}</a>`);
  t = t.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,
    (m, name, alias) => `<span class="wikilink" data-target="${name.trim()}">${(alias || name).trim()}</span>`);
  t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  t = t.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${codes[+i]}</code>`);
  return t;
}

function mdToHtml(src) {
  const lines = String(src || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let i = 0;
  const isBlockStart = ln =>
    /^\s*```/.test(ln) || /^\s{0,3}#{1,6}\s/.test(ln) || /^\s*([-*+]|\d+\.)\s/.test(ln) ||
    /^\s*>/.test(ln) || /^\s*(-{3,}|\*{3,})\s*$/.test(ln) || /^\s*\|/.test(ln);

  while (i < lines.length) {
    const ln = lines[i];
    if (!ln.trim()) { i++; continue; }

    if (/^\s*```/.test(ln)) {
      const lang = ln.replace(/^\s*```/, '').trim();
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre><code${lang ? ` class="lang-${esc(lang)}"` : ''}>${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }
    const h = ln.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
    if (h) { out.push(`<h${h[1].length}>${inlineMd(h[2])}</h${h[1].length}>`); i++; continue; }

    if (/^\s*(-{3,}|\*{3,})\s*$/.test(ln)) { out.push('<hr>'); i++; continue; }

    if (/^\s*>/.test(ln)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push(`<blockquote>${mdToHtml(buf.join('\n'))}</blockquote>`);
      continue;
    }
    // 表格
    if (/^\s*\|/.test(ln) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      const split = row => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      const head = split(ln);
      i += 2;
      const body = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) body.push(split(lines[i++]));
      out.push('<table><thead><tr>' + head.map(c => `<th>${inlineMd(c)}</th>`).join('') + '</tr></thead><tbody>' +
        body.map(r => '<tr>' + r.map(c => `<td>${inlineMd(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }
    // 列表
    if (/^\s*([-*+]|\d+\.)\s/.test(ln)) {
      const ordered = /^\s*\d+\.\s/.test(ln);
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s/.test(lines[i])) {
        let raw = lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/, '');
        let cls = '', box = '';
        const task = raw.match(/^\[( |x|X)\]\s+(.*)$/);
        if (task) { cls = ' class="task"'; box = task[1].toLowerCase() === 'x' ? '☑ ' : '☐ '; raw = task[2]; }
        items.push(`<li${cls}>${box}${inlineMd(raw)}</li>`);
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !isBlockStart(lines[i].trim())) {
          items[items.length - 1] = items[items.length - 1].replace('</li>', ' ' + inlineMd(lines[i++].trim()) + '</li>');
        }
      }
      out.push(ordered ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`);
      continue;
    }
    // 段落
    const buf = [];
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) buf.push(lines[i++]);
    if (!buf.length) { buf.push(lines[i++]); }
    out.push(`<p>${buf.map(inlineMd).join('<br>')}</p>`);
  }
  return out.join('');
}

/* 把 dshimg:xxx 换成真实 URL（异步补图） */
function hydrateImages(root) {
  for (const img of $$('img[data-src]', root)) {
    const src = img.dataset.src || '';
    img.removeAttribute('data-src');
    if (src.startsWith('dshimg:')) {
      const id = src.slice(7);
      if (IMG_CACHE.has(id)) { img.src = IMG_CACHE.get(id); continue; }
      img.style.minHeight = '40px';
      img.alt = img.alt || '（图片载入中）';
      if (!IMG_PENDING.has(id)) {
        IMG_PENDING.set(id, Store.get('assets', id).then(a => {
          if (!a) return null;
          const url = URL.createObjectURL(a.blob);
          IMG_CACHE.set(id, url);
          return url;
        }).catch(() => null).finally(() => IMG_PENDING.delete(id)));
      }
      IMG_PENDING.get(id).then(url => {
        if (url) { img.src = url; img.style.minHeight = ''; }
        else { img.replaceWith(Object.assign(document.createElement('span'), { className: 'wikilink', textContent: '［图片丢失］' })); }
      });
    } else {
      img.src = src;
      img.onerror = () => { img.style.display = 'none'; };
    }
  }
  for (const a of $$('a[href]', root)) a.setAttribute('target', '_blank');
}

function typeStyle(el, typeId) {

function buildCard(n) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = n.id;
  const t = typeStyle(card, n.type);
  card.style.background = t.bg;

  const kids = n.children.length;
  const tg = document.createElement('button');
  tg.className = 'toggle' + (kids ? '' : ' empty');
  tg.textContent = n.collapsed ? '+' : '−';
  tg.title = n.collapsed ? '展开' : '折叠';
  tg.onclick = e => { e.stopPropagation(); n.collapsed = !n.collapsed; renderTree(); };
  card.appendChild(tg);

  const main = document.createElement('div');
  main.className = 'card-main';
  card.appendChild(main);

  const editing = S.edit && S.edit.id === n.id;

  /* 标题 */
  if (editing && S.edit.field === 'title') {
    const ta = makeEditor(n, 'title');
    ta.className = 'ta ttl-ta';
    ta.placeholder = '给这一条起个名字…';
    main.appendChild(ta);
    requestAnimationFrame(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); });
  } else {
    const ttl = document.createElement('div');
    ttl.className = 'ttl';
    ttl.dataset.ph = '未命名' + (n.type !== 'none' ? ` · ${t.name}` : '');
    ttl.textContent = n.title;
    main.appendChild(ttl);
  }

  /* 正文 */
  const bodyWrap = document.createElement('div');
  bodyWrap.className = 'body';
  main.appendChild(bodyWrap);
  if (editing && S.edit.field === 'content') {
    const ta = makeEditor(n, 'content');
    ta.className = 'ta body-ta';
    ta.placeholder = '写正文…（Markdown；Enter 保存，Shift+Enter 换行，双击进入专注写作）';
    bodyWrap.appendChild(ta);
    bodyWrap.style.webkitLineClamp = 'unset';
    requestAnimationFrame(() => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); });
  } else {
    bodyWrap.classList.add('preview-clip');
    bodyWrap.innerHTML = mdToHtml(n.content);
    hydrateImages(bodyWrap);
  }

  /* 一句话大纲 */
  if (n.summary || !!(n.content.trim())) {
    const sl = document.createElement('div');
    sl.className = 'summary-line';
    const stale = n.hash && n.hash !== hashOf(n.content);
    const dot = document.createElement('span');
    dot.className = 'dot' + (n.summaryLocked ? ' lock' : (stale ? '' : ' ok'));
    dot.title = n.summaryLocked ? '已锁定（点一下解锁，下次「总结」会重算这条）' : (stale ? '内容已变，待更新（点一下锁定，保留现在这句话）' : '未锁定（点一下锁定）');
    dot.style.cursor = 'pointer';
    dot.onclick = e => {
      e.stopPropagation();
      n.summaryLocked = !n.summaryLocked;
      renderTree(); scheduleSave();
      toast(n.summaryLocked ? '已锁定这条大纲：下次「总结」不会重算' : '已解锁：下次「总结」会重算这条');
    };
    dot.style.background = n.summaryLocked ? '#B9B2A9' : (stale ? '#E0B25C' : '#D9D2C7');
    sl.appendChild(dot);
    const txt = document.createElement('span');
    txt.className = 'txt' + (n.summary ? ' act' : '');
    txt.textContent = n.summary || '（还没有一句话大纲，点「总结」生成）';
    txt.title = '双击编辑这条大纲';
    txt.ondblclick = e => { e.stopPropagation(); editSummary(n); };
    sl.appendChild(txt);
    main.appendChild(sl);
  }

  /* 类型按钮 */
  const tb = document.createElement('button');
  tb.className = 'type-btn';
  tb.textContent = t.name;
  tb.onclick = e => { e.stopPropagation(); openTypePop(tb, n); };
  card.appendChild(tb);

  /* 鼠标也能加枝干 */
  const ab = document.createElement('button');
  ab.className = 'addbtn';
  ab.textContent = '＋ 枝干';
  ab.title = '在这条笔记下加一条枝干（Tab）';
  ab.onclick = e => { e.stopPropagation(); addChild(n.id); };
  card.appendChild(ab);

  /* 字数 */
  const cnt = document.createElement('div');
  cnt.className = 'count';
  const chars = (n.title.length + n.content.length);
  cnt.textContent = chars ? chars + ' 字' : '';
  card.appendChild(cnt);

  card.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (e.target.closest('.ta,.toggle,.type-btn,.addbtn')) return;
    S.sel = n.id;
  });
  card.addEventListener('click', e => {
    if (e.target.closest('.toggle,.type-btn,.addbtn')) return;
    if (e.target.closest('.ta')) return;                       // 点在正在编辑的文本框里，交给浏览器
    if (S.edit && S.edit.id !== n.id) { S.edit = null; editStamp++; }
    S.sel = n.id;
    const wikilink = e.target.closest('.wikilink');
    if (wikilink) { jumpToTitle(wikilink.dataset.target); return; }
    if (S.viewMode === 'trunk') S.centerColOnce = true;
    if (e.target.closest('.summary-line')) { renderTree(); return; }
    renderTree();                                              // 单击 = 只选中，不进入编辑、不压暗其他枝干
  });
  card.addEventListener('dblclick', e => {
    if (e.target.closest('.toggle,.type-btn,.addbtn')) return;
    const ta = e.target.closest('.ta');
    if (ta && ta.selectionStart !== ta.selectionEnd) return;    // 双击选词，不进编辑
    S.sel = n.id;
    if (e.target.closest('.ttl')) { startEdit(n.id, 'title'); return; }   // 双击标题 = 改标题
    if (S.viewMode === 'trunk') { startEdit(n.id, 'content'); return; }    // 主干视图里双击正文 = 就地编辑（列很窄，不跳专注）
    enterFocus(n.id);                                          // 树状视图：双击卡片 / 正文 = 专注写作（压暗其他枝干）
  });
  return card;
}

function renderNode(n) {
  const el = document.createElement('div');
  el.className = 'node';
  el.dataset.id = n.id;
  if (n.collapsed) el.classList.add('collapsed');
  el.appendChild(buildCard(n));
  if (n.children.length) {
    const box = document.createElement('div');
    box.className = 'children';
    for (const c of childrenOf(n.id)) box.appendChild(renderNode(c));
    el.appendChild(box);
  }
  return el;
}

function renderTree() {
  if (S.viewMode === 'trunk') { renderTrunkView(); return; }
  const trunk = $('#trunk');
  trunk.innerHTML = '';
  for (const r of rootsOf()) trunk.appendChild(renderNode(r));
  applyDimming();
  renderCrumbs();
  updateMinimap();
  const placeMode = S.viewMode === 'place';
  $('#modeBadge').hidden = !(S.focusId || placeMode);
  $('#modeBadge').textContent = placeMode ? '地点' : '聚焦';
  $('#viewport').classList.toggle('focusmode', !!S.focusId && !placeMode);
  updateCtxBar();
  if (placeMode) renderPlaceView();
}

/* ---------- 主干视图：连续分组列（一层一列、各列独立滚动、选中项垂直居中） ---------- */
function rootOfId(id) {
  let n = nodeOf(id);
  if (!n) return null;
  let guard = 0;
  while (n.parentId && nodeOf(n.parentId) && guard++ < 300) n = nodeOf(n.parentId);
  return n;
}

/* 文档顺序里所有「深度 = depth」的节点（depth 0 = 主干/根） */
function nodesAtDepth(depth) {
  const out = [];
  const walk = (id, d) => {
    const n = nodeOf(id);
    if (!n) return;
    if (d === depth) { out.push(n); return; }
    if (d > depth) return;
    for (const c of n.children) walk(c, d + 1);
  };
  for (const r of S.doc.rootIds) walk(r, 0);
  return out;
}

/* 第 depth 层（depth>=1）的分组：上一层每个父节点 + 它的子枝 */
function columnGroups(depth) {
  if (depth === 0) return [{ parent: null, items: rootsOf() }];
  const groups = [];
  for (const p of nodesAtDepth(depth - 1)) groups.push({ parent: p, items: childrenOf(p.id) });
  return groups;
}

/* 从某节点往下沿「第一根子枝」展开，用于默认全展开 */
function seedChain(node, maxDepth) {
  const out = [];
  let cur = node;
  let guard = 0;
  while (cur && guard++ < (maxDepth || 8)) {
    const kids = childrenOf(cur.id);
    if (!kids.length) break;
    cur = kids[0];
    out.push(cur);
  }
  return out;
}

/* 选中节点 → 祖先链 + 默认展开的后代链，每层一列 */
function trunkChain() {
  let sel = S.sel ? nodeOf(S.sel) : null;
  if (!sel) sel = rootsOf()[0] || null;
  if (!sel) return [];
  const path = [];
  let n = sel, guard = 0;
  while (n && guard++ < 300) {
    path.unshift(n);
    n = n.parentId ? nodeOf(n.parentId) : null;
  }
  return path.concat(seedChain(path[path.length - 1], 8));
}

function columnNode(n) {
  const el = document.createElement('div');
  el.className = 'node';
  el.dataset.id = n.id;
  el.appendChild(buildCard(n));
  return el;
}

/* 上下垫高，让第一根/最后一根也能被滚到屏幕中间 */
function padColumn(col) {
  if (col.dataset.padded) return;
  col.dataset.padded = '1';
  const h = Math.max(40, Math.round(col.clientHeight / 2 - 70));
  const top = document.createElement('div');
  top.className = 'col-pad';
  top.style.height = h + 'px';
  const bot = document.createElement('div');
  bot.className = 'col-pad';
  bot.style.height = h + 'px';
  col.insertBefore(top, col.children[1] || null);
  col.appendChild(bot);
}

/* 把某个卡片滚到这一列的垂直中线上 */
/* 选中项所在的那一列 */
function selectedColumnEl() {
  if (!S.sel) return null;
  const el = document.querySelector(`#cols .node[data-id="${CSS.escape(S.sel)}"]`);
  return el ? el.closest('.col') : null;
}

/* 横向把「选中项那一列」滚到屏幕中间；右边留半列，方便同时看到它的下一级分支 */
function centerSelectedColumn() {
  const cols = $('#cols');
  const col = selectedColumnEl();
  if (!cols || !col) return;
  const all = Array.from(cols.querySelectorAll('.col'));
  const i = all.indexOf(col);
  const vw = cols.clientWidth;
  const cw = col.offsetWidth || 306;
  let left = 0;
  if (i > 0) left = col.offsetLeft - (vw - cw) / 2;   // 正中；列宽只占屏幕 1/5，左右自然各露出约 1.8 列
  const max = Math.max(0, cols.scrollWidth - vw);
  cols.scrollTo({ left: Math.min(Math.max(0, left), max), behavior: 'smooth' });
}

/* 横向拖动列带 / Shift+滚轮左右平移 */
/* ---------- 长按拖动：长按卡片 = 拎起它和它整棵子树，松手挂到目标卡片 / 那一列下 ---------- */
const Drag = { pending: null, timer: 0, id: null, ghost: null, hit: null };
let __dragBound = false;

function dragSetTarget(hit) {
  if (Drag.hit && Drag.hit.el) Drag.hit.el.classList.remove('drop-into');
  Drag.hit = hit || null;
  if (Drag.hit && Drag.hit.el) Drag.hit.el.classList.add('drop-into');
}

function dragHitTest(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  if (Drag.ghost && Drag.ghost.contains(el)) return null;
  const card = el.closest('.card');
  if (card) {
    const node = card.closest('.node');
    if (node && node.dataset.id) return { kind: 'card', id: node.dataset.id, el: card };
  }
  const grp = el.closest('.grp');
  if (grp) {
    const pid = grp.dataset.parent || '';
    return pid ? { kind: 'group', id: pid, el: grp } : { kind: 'root', id: null, el: grp };
  }
  const col = el.closest('#cols .col');
  if (col) return { kind: 'root', id: null, el: col };
  return null;
}

function moveNodeTo(id, parentId) {
  const n = nodeOf(id);
  if (!n) return false;
  if (parentId === id) return false;
  if (parentId && subtreeIds(id).includes(parentId)) return false;   /* 不许挂到自己子孙下面 */
  if ((n.parentId || null) === (parentId || null)) return false;
  const oldP = n.parentId;
  if (oldP && nodeOf(oldP)) nodeOf(oldP).children = nodeOf(oldP).children.filter(x => x !== id);
  else S.doc.rootIds = S.doc.rootIds.filter(x => x !== id);
  n.parentId = parentId || null;
  if (parentId) {
    const p = nodeOf(parentId);
    p.collapsed = false;
    if (!p.children.includes(id)) p.children.push(id);
  } else if (!S.doc.rootIds.includes(id)) {
    S.doc.rootIds.push(id);
  }
  touch();
  Undo.push(true);
  S.sel = id;
  scheduleSave();
  return true;
}

function dragGhostFollow(x, y) {
  if (!Drag.ghost) return;
  Drag.ghost.style.left = Math.round(x + 16) + 'px';
  Drag.ghost.style.top = Math.round(y + 14) + 'px';
}

function dragDetach() {
  window.removeEventListener('pointermove', dragOnMove, true);
  window.removeEventListener('pointerup', dragOnUp, true);
  window.removeEventListener('pointercancel', dragOnUp, true);
  document.removeEventListener('keydown', dragOnKey, true);
}

function dragWipe() {
  dragDetach();
  document.body.classList.remove('dragmode');
  for (const el of Array.from(document.querySelectorAll('.node.drag-src'))) el.classList.remove('drag-src');
  for (const el of Array.from(document.querySelectorAll('.drop-into'))) el.classList.remove('drop-into');
  if (Drag.ghost && Drag.ghost.parentNode) Drag.ghost.parentNode.removeChild(Drag.ghost);
  Drag.ghost = null; Drag.hit = null; Drag.id = null;
}

function dragStart(x, y) {
  const pending = Drag.pending;
  Drag.pending = null;
  if (Drag.timer) { clearTimeout(Drag.timer); Drag.timer = 0; }
  const id = pending && pending.id;
  if (!id || !nodeOf(id) || Drag.id) return;
  Drag.id = id;
  document.body.classList.add('dragmode');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  for (const sid of subtreeIds(id)) {
    const el = document.querySelector('.node[data-id="' + CSS.escape(sid) + '"]');
    if (el) el.classList.add('drag-src');
  }
  const kids = subtreeIds(id).length - 1;
  const g = document.createElement('div');
  g.className = 'drag-ghost';
  g.innerHTML = '<b>' + esc(nodeOf(id).title || '未命名') + '</b>' + (kids ? '<span> ＋ ' + kids + ' 根分枝</span>' : '');
  document.body.appendChild(g);
  Drag.ghost = g;
  dragGhostFollow(x, y);
  toast('拖动中：松手挂到目标卡片或那一列 · Esc 取消');
  window.addEventListener('pointermove', dragOnMove, true);
  window.addEventListener('pointerup', dragOnUp, true);
  window.addEventListener('pointercancel', dragOnUp, true);
  document.addEventListener('keydown', dragOnKey, true);
}

function dragOnMove(e) {
  if (!Drag.id) return;
  dragGhostFollow(e.clientX, e.clientY);
  dragSetTarget(dragHitTest(e.clientX, e.clientY));
}

function dragOnKey(e) {
  if (e.key !== 'Escape' || !Drag.id) return;
  e.preventDefault();
  e.stopPropagation();
  dragWipe();
  toast('已取消拖动');
  renderTree();
}

function dragOnUp(e) {
  if (!Drag.id) return;
  const id = Drag.id;
  const hit = dragHitTest(e.clientX, e.clientY);
  dragWipe();
  const blockClick = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
  window.addEventListener('click', blockClick, { capture: true, once: true });
  setTimeout(() => window.removeEventListener('click', blockClick, true), 420);
  if (!hit) { toast('松手在空白处，已取消'); renderTree(); return; }
  const targetParent = hit.kind === 'card' ? hit.id : (hit.kind === 'group' ? hit.id : null);
  if (targetParent && (targetParent === id || subtreeIds(id).includes(targetParent))) {
    toast('不能挂到自己的分枝下面');
    renderTree();
    return;
  }
  const moved = moveNodeTo(id, targetParent);
  if (!moved) { toast('还是原来那个位置'); renderTree(); return; }
  S.centerColOnce = true;
  renderTree();
  toast('已挂到「' + (targetParent ? (nodeOf(targetParent).title || '未命名') : '主干') + '」下面');
}

function bindDrag() {
  if (__dragBound) return;
  __dragBound = true;
  /* 按下：起一个 460ms 的长按计时器；移动超过 8px 就当作点击/拖画布，取消长按 */
  document.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || Drag.id) return;
    if (S.viewMode !== 'trunk') return;   /* 拖动换父枝只在主干视图里用 */
    if (e.target.closest('.ta,input,textarea,button,.toggle,.type-btn,.addbtn,.col-tail,.grp-hd')) return;
    const card = e.target.closest('.card');
    if (!card) return;
    const node = card.closest('.node');
    if (!node || !node.dataset.id) return;
    Drag.pending = { id: node.dataset.id, x: e.clientX, y: e.clientY };
    if (Drag.timer) clearTimeout(Drag.timer);
    const px = e.clientX, py = e.clientY;
    Drag.timer = setTimeout(() => dragStart(px, py), 460);
  }, true);
  document.addEventListener('pointermove', (e) => {
    if (Drag.id || !Drag.pending) return;
    if (Math.abs(e.clientX - Drag.pending.x) > 8 || Math.abs(e.clientY - Drag.pending.y) > 8) {
      if (Drag.timer) { clearTimeout(Drag.timer); Drag.timer = 0; }
      Drag.pending = null;
    }
  }, true);
  document.addEventListener('pointerup', () => {
    if (Drag.id) return;
    if (Drag.timer) { clearTimeout(Drag.timer); Drag.timer = 0; }
    Drag.pending = null;
  }, true);
  document.addEventListener('pointercancel', () => {
    if (Drag.id) return;
    if (Drag.timer) { clearTimeout(Drag.timer); Drag.timer = 0; }
    Drag.pending = null;
  }, true);
}

function bindColsPan() {
  const cols = $('#cols');
  if (!cols || cols.dataset.panBound) return;
  cols.dataset.panBound = '1';
  let sx = 0, sl = 0, active = false, moved = false;
  cols.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('textarea,input,button,.ta,.col-tail')) return;
    active = true; moved = false; sx = e.clientX; sl = cols.scrollLeft;
    __colAnimSeq++;   /* 取消未完成的居中动画 */
    cols.classList.add('armed');
  });
  window.addEventListener('pointermove', (e) => {
    if (!active) return;
    if (Drag.id) return;          /* 长按拖动中：不拖画布 */
    const dx = e.clientX - sx;
    if (!moved && Math.abs(dx) > 5) { moved = true; cols.classList.add('panning'); }
    if (moved) cols.scrollLeft = sl - dx;
  });
  window.addEventListener('pointerup', () => {
    if (!active) return;
    active = false;
    cols.classList.remove('armed');
    if (!moved) return;
    cols.classList.remove('panning');
    /* 拖完这一下别再触发卡片选中 */
    const block = (ev) => { ev.stopPropagation(); ev.preventDefault(); };
    window.addEventListener('click', block, { capture: true, once: true });
  });
  cols.addEventListener('wheel', (e) => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      __colAnimSeq++;
      setTrunkZoom((Number(settings.trunkZoom) || 1) + (e.deltaY < 0 ? 0.1 : -0.1));
      return;
    }
    if (e.shiftKey) {
      e.preventDefault();
      __colAnimSeq++;
      cols.scrollLeft += (e.deltaY || 0) + (e.deltaX || 0);
      return;
    }
    __colAnimSeq++;   /* 普通滚轮也在动某列的纵向滚动，让居中动画让位 */
  }, { passive: false });
}

function centerInColumn(col, el) {
  if (!col || !el) return;
  const cr = col.getBoundingClientRect();
  const er = el.getBoundingClientRect();
  /* 列头是 sticky 的，会盖住滚动区顶端一条：把它从可用高度里扣掉，认「看得见的中间」 */
  const hd = col.querySelector('.col-hd');
  const hh = hd ? hd.offsetHeight : 0;
  const midY = cr.top + hh + (cr.height - hh) / 2;
  const delta = (er.top + er.height / 2) - midY;
  if (Math.abs(delta) > 1) col.scrollTop = Math.max(0, col.scrollTop + delta);
}

function revealInColumn(id) {
  if (!id) return;
  const el = document.querySelector(`#cols .node[data-id="${CSS.escape(id)}"]`);
  if (!el) return;
  const col = el.closest('.col');
  centerInColumn(col, el);
}

/* 一列：按父节点分组渲染，父节点对应的那组标成 .on */
function buildColumn(depth, groups, activeItemId, activeParentId) {
  const col = document.createElement('div');
  col.className = 'col';
  col.dataset.depth = String(depth);

  const hd = document.createElement('div');
  hd.className = 'col-hd';
  const t = document.createElement('span');
  t.textContent = depth === 0 ? '主干' : '第 ' + (depth + 1) + ' 层';
  hd.appendChild(t);
  const total = groups.reduce((n, g) => n + g.items.length, 0);
  const c = document.createElement('span');
  c.className = 'ch-count';
  c.textContent = total ? total + ' 枝' : '';
  hd.appendChild(c);
  col.appendChild(hd);

  if (!total) {
    const em = document.createElement('div');
    em.className = 'empty';
    em.textContent = depth === 0
      ? '还没有枝条。双击空白处、按 Enter 或 Tab 开始长第一根枝干。'
      : '这一层还没有分支。';
    col.appendChild(em);
    return col;
  }

  for (const g of groups) {
    const wrap = document.createElement('div');
    wrap.className = 'grp' + (g.parent && g.parent.id === activeParentId ? ' on' : '');
    wrap.dataset.parent = g.parent ? g.parent.id : '';
    wrap.dataset.depth = String(depth);

    if (depth > 0 && g.parent) {
      const gh = document.createElement('button');
      gh.type = 'button';
      gh.className = 'grp-hd';
      gh.textContent = (g.parent.title || '（未命名）') + (g.items.length ? '' : ' · 空');
      gh.title = '选中这根：' + (g.parent.title || '（未命名）');
      gh.onclick = e => { e.stopPropagation(); selectNode(g.parent.id, false); };
      wrap.appendChild(gh);
    }

    for (const n of g.items) {
      const el = columnNode(n);
      if (n.id === activeItemId) el.classList.add('sel');
      wrap.appendChild(el);
    }

    if (depth > 0 && g.parent && g.parent.id === activeParentId) {
      const tail = document.createElement('button');
      tail.type = 'button';
      tail.className = 'col-tail';
      tail.textContent = '＋ 在这一层加一根';
      tail.onclick = e => { e.stopPropagation(); addChild(g.parent.id); };
      wrap.appendChild(tail);
    }

    col.appendChild(wrap);
  }

  return col;
}

/* #RRGGBB → rgba(r,g,b,a)；容错：解析不了就退回暖灰 */
function hexA(hex, a) {
  const h = String(hex || '').replace('#', '');
  const s6 = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const n = parseInt(s6, 16);
  if (s6.length !== 6 || !Number.isFinite(n)) return 'rgba(190,137,120,' + a + ')';
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

let __colAnimSeq = 0;
/* ---------- 包络：以主干或选中分支为核心的从属色带 ---------- */
let __envIds = null, __envColor = null, __envRaf = 0;
function scheduleEnvelope() {
  if (__envRaf) return;
  __envRaf = requestAnimationFrame(() => { __envRaf = 0; paintEnvelopes(); });
}
function paintEnvelopes() {
  const layer = document.getElementById('envLayer');
  const cols = document.getElementById('cols');
  if (!layer || !cols) return;
  layer.textContent = '';
  if (!__envIds || !__envIds.size) return;
  const lr = layer.getBoundingClientRect();
  /* 先算每列被包络的上下沿 */
  const segs = [];
  for (const col of Array.from(cols.querySelectorAll('.col'))) {
    const cr = col.getBoundingClientRect();
    if (cr.right < lr.left - 60 || cr.left > lr.right + 60) continue;
    let top = Infinity, bottom = -Infinity;
    for (const el of Array.from(col.querySelectorAll('.node'))) {
      if (!__envIds.has(el.dataset.id)) continue;
      const r = el.getBoundingClientRect();
      top = Math.min(top, r.top);
      bottom = Math.max(bottom, r.bottom);
    }
    if (!Number.isFinite(top)) continue;
    segs.push({ cr, top, bottom });
  }
  const BLEED = 7;   /* 正好伸到列间空隙的中线，相邻段拼成一整片 */
  const plan = segs.map((sg, i) => {
    const prev = segs[i - 1], next = segs[i + 1];
    const joinsPrev = !!prev && sg.top < prev.bottom + 12 && sg.bottom > prev.top - 12;
    const joinsNext = !!next && sg.top < next.bottom + 12 && sg.bottom > next.top - 12;
    return { sg, joinsPrev, joinsNext };
  });
  /* 两遍画：先画略大一圈的「描边层」，再画填充，内部接缝就被盖住，只剩一圈外沿 */
  for (const pass of ['edge', 'fill']) {
    for (const { sg, joinsPrev, joinsNext } of plan) {
      const pad = pass === 'edge' ? 2 : 0;
      const band = document.createElement('div');
      band.className = 'env-band';
      band.style.left = (sg.cr.left - lr.left - (joinsPrev ? BLEED : 0) - pad) + 'px';
      band.style.width = (sg.cr.width + (joinsPrev ? BLEED : 0) + (joinsNext ? BLEED : 0) + pad * 2) + 'px';
      band.style.top = (sg.top - lr.top - 8 - pad) + 'px';
      band.style.height = (Math.max(28, sg.bottom - sg.top + 16) + pad * 2) + 'px';
      const rl = joinsPrev ? 0 : 15 + pad, rr = joinsNext ? 0 : 15 + pad;
      band.style.borderRadius = rl + 'px ' + rr + 'px ' + rr + 'px ' + rl + 'px';
      band.style.setProperty('--env-bg', pass === 'edge' ? __envColor.bd : __envColor.bg);
      layer.appendChild(band);
    }
  }
}
function refreshEnvelopes() {
  const cols = document.getElementById('cols');
  const selId = S.sel && nodeOf(S.sel) ? S.sel : (rootsOf()[0] || {}).id;
  const base = selId ? nodeOf(selId) : null;
  __envIds = null;
  if (!base) { paintEnvelopes(); return; }
  const root = rootOfId(selId);
  const isTrunk = !!root && root.id === selId;
  const ids = new Set();
  if (isTrunk) subtreeIds(selId).forEach(id => ids.add(id));
  else {
    ancestorsOf(selId).forEach(a => ids.add(a.id));
    subtreeIds(selId).forEach(id => ids.add(id));
  }
  const t = typeOf(base.type);
  __envIds = ids;
  __envColor = { bg: hexA(t.fg || '#9B958A', isTrunk ? 0.14 : 0.18), bd: hexA(t.fg || '#9B958A', isTrunk ? 0.22 : 0.30) };
  paintEnvelopes();
}   /* 横向/纵向居中动画的代号：新动画或用户拖动时作废旧动画 */
function renderTrunkView() {
  const cols = $('#cols');
  if (!cols) return;
  const keepLeft = cols.scrollLeft;
  const keepV = new Map();
  for (const c of Array.from(cols.children)) {
    if (c.classList && c.classList.contains('col')) keepV.set(c.dataset.depth, c.scrollTop);
  }
  cols.innerHTML = '';
  /* 左右垫宽：让第一列和最后一列也能滚到屏幕正中 */
  const colw = (cols.querySelector('.col') || {}).offsetWidth || 306;
  const padX = Math.max(28, Math.round((cols.clientWidth - colw) / 2) + 14);
  cols.style.paddingLeft = padX + 'px';
  cols.style.paddingRight = padX + 'px';

  const roots = rootsOf();
  if (!roots.length) {
    const em = document.createElement('div');
    em.className = 'empty';
    em.textContent = '还没有枝条。双击空白处、按 Enter 或 Tab 开始长第一根枝干。';
    cols.appendChild(em);
    applyDimming();
    renderCrumbs();
    $('#modeBadge').hidden = true;
    updateCtxBar();
    return;
  }

  if (!S.sel || !nodeOf(S.sel)) S.sel = roots[0].id;
  const chain = trunkChain();

  const defs = [{ depth: 0, groups: columnGroups(0), activeItemId: chain[0] ? chain[0].id : null, activeParentId: null }];
  for (let d = 0; d < chain.length; d++) {
    defs.push({
      depth: d + 1,
      groups: columnGroups(d + 1),
      activeItemId: chain[d + 1] ? chain[d + 1].id : null,
      activeParentId: chain[d].id
    });
  }
  /* 末尾连着空列就不画（叶子之后没有分支） */
  while (defs.length > 2 && defs[defs.length - 1].groups.every(g => !g.items.length)) defs.pop();

  for (const d of defs) cols.appendChild(buildColumn(d.depth, d.groups, d.activeItemId, d.activeParentId));

  /* 定位：每列把它的「当前项」滚到屏幕中线；最后那列把选中项的第一根分支对齐到中线，
     于是分支从与选中卡片平齐的位置往下排，往上就是同一层前一根枝条（上一根主干）的分支 */
  /* 每列的「当前项」：d.activeItemId 就是这一列里应该居中的那张卡片；
     最后那列没有 activeItem 时，用 activeParent 的第一根分支（没分支就用它的分组表头）当参照 */
  function columnTarget(col, d) {
    if (d.activeItemId) {
      const el = col.querySelector(`.node[data-id="${CSS.escape(d.activeItemId)}"]`);
      if (el) return el;
    }
    if (d.activeParentId) {
      const first = childrenOf(d.activeParentId)[0];
      if (first) {
        const el = col.querySelector(`.node[data-id="${CSS.escape(first.id)}"]`);
        if (el) return el;
      }
      const grp = col.querySelector(`.grp[data-parent="${CSS.escape(d.activeParentId)}"]`);
      if (grp) return grp.querySelector('.grp-hd') || grp;
    }
    return null;
  }

  function positionColumns() {
    defs.forEach((d, i) => {
      const col = cols.children[i];
      if (!col) return;
      padColumn(col);
      const targetEl = columnTarget(col, d);
      if (targetEl) centerInColumn(col, targetEl);
    });
  }

  /* 把某列的目标 scrollTop 算出来（不立即写），用于平滑过渡 */
  function columnTargetTop(col, el) {
    const cr = col.getBoundingClientRect(), er = el.getBoundingClientRect();
    const hd = col.querySelector('.col-hd');
    const hh = hd ? hd.offsetHeight : 0;
    const midY = cr.top + hh + (cr.height - hh) / 2;
    return Math.max(0, col.scrollTop + ((er.top + er.height / 2) - midY));
  }

  /* 点击后的居中：从「现在的位置」平滑滑过去，而不是先跳回最左再滑 */
  function animateToCenter() {
    const vw = cols.clientWidth;
    const selCol = selectedColumnEl();
    const all = Array.from(cols.querySelectorAll('.col'));
    const i = selCol ? all.indexOf(selCol) : 0;
    let left = 0;
    if (selCol && i > 0) left = selCol.offsetLeft - (vw - selCol.offsetWidth) / 2;
    const maxLeft = Math.max(0, cols.scrollWidth - vw);
    left = Math.min(Math.max(0, left), maxLeft);

    const jobs = [];
    defs.forEach((d, idx) => {
      const col = cols.children[idx];
      if (!col) return;
      const el = columnTarget(col, d);
      if (!el) return;
      /* 起点：沿用重建前同一层那一列的滚动位置，先落到那儿再一起滑 */
      const prev = keepV.has(col.dataset.depth) ? keepV.get(col.dataset.depth) : 0;
      col.scrollTop = Math.min(prev, Math.max(0, col.scrollHeight - col.clientHeight));
      jobs.push({ col, from: col.scrollTop, to: columnTargetTop(col, el) });
    });

    const startLeft = keepLeft;
    const startTop = new Map(jobs.map(j => [j.col, j.col.scrollTop]));
    const token = ++__colAnimSeq;
    /* 系统开了「减少动态效果」就直接到位 */
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const dur = reduce ? 1 : 340;
    const t0 = performance.now();
    const ease = (t) => 1 - Math.pow(1 - t, 3);
    function step(now) {
      if (token !== __colAnimSeq) return;   /* 被新的动画或用户拖动接管了 */
      const p = Math.min(1, (now - t0) / Math.max(1, dur)), e = ease(p);
      cols.scrollLeft = startLeft + (left - startLeft) * e;
      for (const j of jobs) {
        j.col.scrollTop = startTop.get(j.col) + (j.to - startTop.get(j.col)) * e;
      }
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  if (S.restoreView) {
    /* 刚进面板：按上次存下来的滚动位置还原（不再自动居中，避免一进来就跳） */
    const st = S.restoreView;
    S.restoreView = null;
    defs.forEach((d, idx) => {
      const col = cols.children[idx];
      if (!col) return;
      padColumn(col);
      const t = st.tops ? st.tops[col.dataset.depth] : undefined;
      if (typeof t === 'number' && isFinite(t)) col.scrollTop = t;
    });
    const maxLeft = Math.max(0, cols.scrollWidth - cols.clientWidth);
    cols.scrollLeft = Math.min(Math.max(0, Number(st.colsLeft) || 0), maxLeft);
  } else if (S.centerColOnce) {
    /* 点击路径：先把每列恢复到重建前的位置（同帧，不会闪），下一帧从那儿滑到中线 */
    S.centerColOnce = false;
    defs.forEach((d, idx) => {
      const col = cols.children[idx];
      if (!col) return;
      padColumn(col);
      const prev = keepV.has(col.dataset.depth) ? keepV.get(col.dataset.depth) : 0;
      col.scrollTop = Math.min(prev, Math.max(0, col.scrollHeight - col.clientHeight));
    });
    cols.scrollLeft = keepLeft;
    requestAnimationFrame(() => requestAnimationFrame(animateToCenter));
  } else {
    positionColumns();
    requestAnimationFrame(() => {
      positionColumns();
      cols.scrollLeft = keepLeft;
    });
  }

  /* 包络：默认罩住当前主干的整棵树；选中分支时罩住「祖先链 + 该分支整棵子树」，不含同级 */
  refreshEnvelopes();
  for (const el of Array.from(cols.querySelectorAll('.col'))) {
    el.addEventListener('scroll', scheduleSaveViewState, { passive: true });
    if (!el.dataset.envBound) {
      el.dataset.envBound = '1';
      el.addEventListener('scroll', scheduleEnvelope, { passive: true });
    }
  }

  applyDimming();
  /* 路径高亮：选中项所在的祖先链（每列的当前项）加一道细描边，一眼看出这枝挂在哪个主干上 */
  for (const n of chain) {
    const el = cols.querySelector(`.node[data-id="${CSS.escape(n.id)}"]`);
    if (el) el.classList.add('path');
  }
  renderCrumbs();
  const depth = chain.length;
  $('#modeBadge').hidden = !(S.focusId || depth > 1);
  $('#modeBadge').textContent = S.focusId ? '聚焦' : '主干 · 第 ' + depth + ' 层';
  $('#viewport').classList.toggle('focusmode', !!S.focusId);
  updateCtxBar();
}

/* 聚焦到某根主干：选中它，它的分支列自动排到与它平齐的位置 */
function focusTrunk(rootId) {
  if (!nodeOf(rootId)) return;
  S.sel = rootId;
  S.edit = null;
  S.centerColOnce = true;
  renderTrunkView();
  flash(rootId);
}

function applyDimming() {
  // 选中只是高亮；只有「正在编辑 / 专注写作」才压暗其他枝干（单击不进入编辑，也就不压暗）
  const selId = S.sel && nodeOf(S.sel) ? S.sel : null;
  const editId = S.edit && nodeOf(S.edit.id) ? S.edit.id : null;
  const bright = new Set(), rel = new Set();
  if (editId) {
    // 1) 自己 + 自己的整棵子树：全亮
    subtreeIds(editId).forEach(id => bright.add(id));
    // 2) 从主干一路到自己的祖先：它们"包含着这条分支"，同样保持全亮
    ancestorsOf(editId).forEach(a => bright.add(a.id));
    // 3) 同级的兄弟枝干（含其子树）：中等亮度
    for (const s of siblingsOf(editId)) if (s.id !== editId) subtreeIds(s.id).forEach(id => rel.add(id));
  }
  const focusTree = S.focusId ? new Set(subtreeIds(S.focusId)) : null;
  const focusPath = S.focusId ? new Set(ancestorsOf(S.focusId).map(a => a.id)) : null;

  for (const el of $$('.node')) {
    const id = el.dataset.id;
    if (S.focusId) {
      const inFocus = focusTree.has(id);
      const near = rel.has(id) || focusPath.has(id);
      el.classList.remove('dim1', 'dim2');
      el.classList.toggle('sel', id === S.focusId);
      el.classList.toggle('rel', !inFocus && near);
      continue;
    }
    const isSel = id === selId;
    const dim1 = !!editId && !isSel && rel.has(id);
    const dim2 = !!editId && !isSel && !bright.has(id) && !rel.has(id);
    el.classList.toggle('dim1', dim1);
    el.classList.toggle('dim2', dim2);
    el.classList.toggle('sel', isSel);
  }
}

function renderCrumbs() {
  const box = $('#crumbs');
  box.innerHTML = '';
  const id = S.focusId || S.sel;
  const n = id && nodeOf(id);
  if (!n) return;
  const path = pathOf(n.id);
  path.forEach((p, i) => {
    if (i) { const sep = document.createElement('i'); sep.textContent = '›'; box.appendChild(sep); }
    const a = document.createElement('a');
    a.textContent = nodeLabel(p);
    a.onclick = () => { selectNode(p.id, true); };
    box.appendChild(a);
  });
}

/* =========================================================
   8. 编辑与结构操作
   ========================================================= */
let editStamp = 0;

function hashOf(s) {
  let h = 5381;
  const t = String(s || '');
  for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}

function makeEditor(n, field) {
  const ta = document.createElement('textarea');
  ta.className = 'ta';
  ta.rows = 1;
  ta.dataset.id = n.id;
  ta.dataset.field = field;
  ta.value = field === 'title' ? n.title : n.content;
  const grow = () => { ta.style.height = 'auto'; ta.style.height = Math.max(20, ta.scrollHeight) + 'px'; };
  requestAnimationFrame(grow);
  const stamp = ++editStamp;
  ta.addEventListener('input', () => {
    n[field] = ta.value;
    n.ts = Date.now();
    touch(); grow(); scheduleSave(); Undo.push(); scheduleCtx();
  });
  ta.addEventListener('blur', () => {
    setTimeout(() => {
      if (editStamp !== stamp) return;
      if (!S.edit || S.edit.id !== n.id) return;
      if (document.activeElement && document.activeElement.classList?.contains('ta')) return;
      S.edit = null;
      renderTree();
      Undo.push(true);
    }, 150);
  });
  ta.addEventListener('keydown', ev => onEditorKey(ev, n, field, ta));
  ta.addEventListener('paste', ev => onPaste(ev, ta));
  return ta;
}

function onEditorKey(ev, n, field, ta) {
  const k = ev.key;
  if (k === 'Escape') {
    ev.preventDefault();
    if (S.focusId === n.id) { exitFocus(); return; }   // 专注模式下 Esc = 回到整体
    S.edit = null; S.sel = n.id; renderTree(); return;
  }
  if (k === 'Tab') { ev.preventDefault(); ev.shiftKey ? outdent(n.id) : addChild(n.id); return; }
  if (k === 'Enter') {
    /* Ctrl/⌘ + Enter = 进专注写作（在编辑器里任何时候都优先） */
    if (ev.ctrlKey || ev.metaKey) { ev.preventDefault(); enterFocus(n.id); return; }
    /* 正文里 Shift + Enter = 换行（唯一保留的换行手势，专注模式里也一样） */
    if (field === 'content' && ev.shiftKey) return;   /* 不拦，交给浏览器默认换行 */
    /* 普通回车 = 保存并退出编辑（标题、正文都这样，专注模式也这样） */
    ev.preventDefault();
    commitEdit(n.id);
    return;
  }
  const atStart = ta.selectionStart === 0 && ta.selectionEnd === 0;
  if ((k === 'Backspace' || k === 'Delete') && ta.value === '' && field === 'content') {
    ev.preventDefault();
    delNode(n.id);
    return;
  }
  if (k === 'ArrowUp' && atStart && !ta.value.includes('\n')) { ev.preventDefault(); moveSel(-1); return; }
  if (k === 'ArrowDown' && ta.selectionStart === ta.value.length && !ta.value.includes('\n')) {
    ev.preventDefault(); moveSel(1);
  }
}

function startEdit(id, field) {
  const n = nodeOf(id);
  if (!n) return;
  S.sel = id;
  S.edit = { id, field: field || 'content' };
  editStamp++;
  renderTree();
  const ta = $(`textarea.ta[data-id="${id}"][data-field="${S.edit.field}"]`);
  if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}

function stopEdit() { S.edit = null; renderTree(); }

/* 保存并退出编辑（回车 / 点空白都走这里；Shift+回车是换行；内容在 input 时就已写进节点，这里只收尾） */
function commitEdit(id) {
  if (!S.edit) return;
  S.edit = null;
  editStamp++;
  if (id) S.sel = id;
  renderTree();
  Undo.push(true);
  scheduleSave();
}

function addSibling(id, opts = {}) {
  const n = nodeOf(id);
  if (!n) return null;
  const arrIsRoot = !n.parentId;
  const arr = arrIsRoot ? S.doc.rootIds : nodeOf(n.parentId).children;
  const idx = arr.indexOf(id);
  const nn = addNode(n.parentId, opts);
  const arr2 = arrIsRoot ? S.doc.rootIds : nodeOf(n.parentId).children;
  arr2.splice(arr2.indexOf(nn.id), 1);
  arr2.splice(idx + 1, 0, nn.id);
  Undo.push(true);
  if (S.focusId) { S.focusId = null; }
  S.sel = nn.id;
  renderTree();
  startEdit(nn.id, 'title');
  centerOn(nn.id);
  centerNewNodeInTrunk(nn.id);
  scheduleSave();
  return nn;
}

function addChild(id, opts = {}) {
  const p = nodeOf(id);
  if (!p) return null;
  p.collapsed = false;
  const nn = addNode(id, opts);
  Undo.push(true);
  S.sel = nn.id;
  renderTree();
  startEdit(nn.id, 'title');
  centerOn(nn.id);
  centerNewNodeInTrunk(nn.id);
  scheduleSave();
  return nn;
}

/* 新建的枝条在建出来后，把「它所在的那一列」横纵都滚到屏幕中间（主干视图） */
function centerNewNodeInTrunk(id) {
  if (S.viewMode !== 'trunk') return;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (S.viewMode !== 'trunk' || S.sel !== id) return;
    revealInColumn(id);
    centerSelectedColumn();
  }));
}

/* 判定三分支的默认名称：三根都带上判定名，方便在任何一列里一眼看出这是哪一次判定的结果 */
function judgeBranchNames(name) {
  const t = typeof name === 'string' ? name.trim() : '';
  if (!t) return ['成功', '失败', '孤注一掷'];
  return [`成功·${t}`, `失败·${t}`, `孤注一掷·${t}`];
}

/* 点「生成判定三分支」时先问判定名：默认取卡片当前标题，回车即用默认值 */
function askJudgeName(defaultName) {
  return new Promise(resolve => {
    const box = openModal(`
      <h3>判定名称</h3>
      <p style="color:#A39A91;font-size:12px">这个名字会写进三根结果子枝（成功·名字 / 失败·名字 / 孤注一掷·名字），卡片类型同时变成「判定」。留空则只叫 成功 / 失败 / 孤注一掷。</p>
      <input type="text" id="judgeName" style="width:100%;margin-top:8px" placeholder="例如：侧耳听门内的动静">
      <div class="foot">
        <button class="btn ghost" id="judgeCancel">取消</button>
        <button class="btn primary" id="judgeOk">生成</button>
      </div>`);
    const input = box.querySelector('#judgeName');
    const done = val => { closeModal(); resolve(val); };
    input.value = typeof defaultName === 'string' ? defaultName : '';
    setTimeout(() => { input.focus(); input.select(); }, 20);
    box.querySelector('#judgeCancel').onclick = () => done(null);
    box.querySelector('#judgeOk').onclick = () => done(input.value);
    input.addEventListener('keydown', ev => {
      ev.stopPropagation();
      if (ev.key === 'Enter') { ev.preventDefault(); done(input.value); }
      else if (ev.key === 'Escape') { ev.preventDefault(); done(null); }
    });
  });
}

/* 判定三分支的完整流程：先问名字，再长三根；返回是否真的生成了 */
async function runJudgeFlow(id) {
  const cur = nodeOf(id);
  if (!cur) return false;
  const name = await askJudgeName(cur.title);
  if (name === null) return false;
  addJudge(id, name);
  return true;
}

/* 是不是「成功 / 失败 / 孤注一掷」这类判定结果卡（它们类型也是判定，但不该再触发三分支） */
function isJudgeResultTitle(title) {
  const t = typeof title === 'string' ? title.trim() : '';
  return /^(成功|失败|孤注一掷)(·|$)/.test(t);
}

/* 判定卡片还没有结果时，Tab 直接走「生成判定三分支」 */
function judgeFlowByTab(id) {
  const cur = nodeOf(id);
  if (!cur || cur.type !== 'check') return false;
  if (cur.children && cur.children.length > 0) return false;
  if (isJudgeResultTitle(cur.title)) return false;
  runJudgeFlow(id);
  return true;
}

/* 判定节点：自动长出三个结果子节点；name 只用于三根子枝的命名，不动本卡标题 */
function addJudge(id, name) {
  const p = nodeOf(id);
  if (!p) return;
  const typed = typeof name === 'string' ? name.trim() : null;
  p.type = 'check';
  p.collapsed = false;
  const names = judgeBranchNames(typed !== null ? typed : p.title);
  /* 三根结果卡片默认也是「判定」类型，颜色和父级一致，一眼看得出是同一次判定 */
  for (const nm of names) addNode(id, { title: nm, content: '', type: 'check' });
  Undo.push(true);
  renderTree();
  scheduleSave();
  const tip = names[2].length > 24 ? names[2].slice(0, 24) + '…' : names[2];
  toast(`已生成「成功 / 失败 / ${tip}」三个结果`);
}

function outdent(id) {
  const n = nodeOf(id);
  if (!n || !n.parentId) return;
  const p = nodeOf(n.parentId);
  p.children = p.children.filter(x => x !== id);
  const gp = p.parentId;
  const arr = gp ? nodeOf(gp).children : S.doc.rootIds;
  n.parentId = gp;
  arr.splice(arr.indexOf(p.id) + 1, 0, id);
  Undo.push(true); renderTree(); scheduleSave();
  S.sel = id; centerOn(id);
}

function moveInSiblings(id, dir) {
  const n = nodeOf(id);
  if (!n) return;
  const arr = n.parentId ? nodeOf(n.parentId).children : S.doc.rootIds;
  const i = arr.indexOf(id);
  const j = i + dir;
  if (j < 0 || j >= arr.length) return;
  arr.splice(i, 1); arr.splice(j, 0, id);
  Undo.push(true); renderTree(); scheduleSave();
  centerOn(id);
}

function delNode(id) {
  const n = nodeOf(id);
  if (!n) return;
  const kids = n.children.length;
  if (kids && !confirm(`这条下面还有 ${kids} 条枝干，会一起删掉。确定？`)) return;
  const arr = n.parentId ? nodeOf(n.parentId).children : S.doc.rootIds;
  const i = arr.indexOf(id);
  arr.splice(i, 1);
  for (const d of subtreeIds(id)) delete S.doc.nodes[d];
  if (S.edit?.id === id) S.edit = null;
  if (S.focusId === id) S.focusId = null;
  const next = arr[Math.min(i, arr.length - 1)] || n.parentId || arr[0] || null;
  S.sel = next;
  Undo.push(true); renderTree(); scheduleSave();
}

/* =========================================================
   9. 选择 / 专注 / 导航
   ========================================================= */
function visibleNodes() {
  const out = [];
  const walk = id => {
    const n = nodeOf(id);
    if (!n) return;
    out.push(n);
    if (!n.collapsed) for (const c of n.children) walk(c);
  };
  for (const r of S.doc.rootIds) walk(r);
  return out;
}

function selectNode(id, doCenter) {
  if (!nodeOf(id)) return;
  S.sel = id;
  S.edit = null;
  if (S.viewMode === 'trunk') S.centerColOnce = true;
  renderTree();
  if (doCenter) centerOn(id);
  scheduleSaveViewState();   /* 记住这次看到的是哪张卡片 */
}

function moveSel(dir) {
  const list = visibleNodes();
  if (!list.length) return;
  if (!S.sel) { selectNode(list[0].id, true); return; }
  const i = list.findIndex(n => n.id === S.sel);
  const nid = list[clamp(i + dir, 0, list.length - 1)] || list[0];
  selectNode(nid.id, true);
}

function enterFocus(id) {
  if (!nodeOf(id)) return;
  if (S.viewMode === 'place') setViewMode('tree', true);
  S.focusId = id;
  S.sel = id;
  S.edit = { id, field: 'content' };
  editStamp++;
  renderTree();
  centerOn(id);
  setTimeout(() => {
    const ta = $(`textarea.ta[data-id="${id}"][data-field="content"]`);
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }, 30);
}

function exitFocus() {
  if (!S.focusId) return;
  S.focusId = null;
  S.edit = null;
  renderTree();
}
